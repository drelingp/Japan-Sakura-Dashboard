    }
  };

  function detectLanguage() {
    var lang = String(navigator.language || "en").toLowerCase();
    if (lang.indexOf("zh") === 0) return "zh-Hant";
    if (lang.indexOf("ja") === 0) return "ja";
    return "en";
  }

  function getLocale() {
    return currentLang === "ja" ? "ja-JP" : (currentLang === "zh-Hant" ? "zh-TW" : "en-US");
  }

  function tr(path) {
    var parts = path.split(".");
    var node = I18N[currentLang] || I18N.en;
    var fallback = I18N.en;
    for (var i = 0; i < parts.length; i++) {
      node = node && node[parts[i]];
      fallback = fallback && fallback[parts[i]];
    }
    return node != null ? node : fallback;
  }

  function tmpl(value, params) {
    return String(value).replace(/\{(\w+)\}/g, function(_, key) {
      return params[key] != null ? params[key] : "";
    });
  }

  function getPluralDayLabel(days) {
    if (currentLang === "en") return days === 1 ? tr("day") : tr("days");
    return tr("days");
  }

  function getRegionDisplay(regionKey) {
    if (regionKey === "All") return tr("allRegions");
    if (currentLang === "en") return regionKey;
    return currentLang === "ja" ? REGION_META[regionKey].ja : REGION_META[regionKey].zh;
  }

  function getCityPrimaryName(city) {
    return currentLang === "en" ? city.name : city.ja;
  }

  function getCitySecondaryName(city) {
    return currentLang === "en" ? city.ja : city.name;
  }

  function getSpotTagLabel(tag) {
    return tr("spotTags." + tag) || tag;
  }

  function getSpotTimingLabel(timing) {
    return tr("spotTiming." + timing) || timing;
  }

  function getSpotTimingBucket(spot) {
    var status = getStatus(spot);
    if (status === "pending") return "pending";
    if (status === "blooming" || status === "full_bloom") return "peak";
    if (status === "not_yet" || status === "budding") return "upcoming";
    return "falling";
  }

  function getSpotSourceFilterLabel(sourceKey) {
    return tr("spotSourceFilter." + sourceKey) || sourceKey;
  }

  function getSpotSourceDisplay(spot) {
    if (spot.sourceType === "live-spot") return tr("spotLiveSource");
    if (spot.rank) {
      return tr("loadedSource") + " #" + spot.rank;
    }
    return tr("seededSource");
  }

  function hasForecastDates(item) {
    return !!(item && (item.bloom || item.full));
  }

  function hasValidCoordinates(item) {
    return !!(item && typeof item.lat === "number" && !Number.isNaN(item.lat) && typeof item.lng === "number" && !Number.isNaN(item.lng));
  }

  function getForecastBasisLabel(item) {
    if (!item) return tr("forecastUnavailable");
    if (item.type === "city") {
      if (item.forecastSourceType === "city-live") return tr("cityLiveForecast");
      if (item.forecastSourceType === "city-fallback") return tr("fallbackCityForecast");
      return tr("forecastUnavailable");
    }
    if (item.forecastSourceType === "spot-live") return tr("spotExactForecast");
    if (item.forecastSourceType === "city-live") return tmpl(tr("spotCityForecast"), { city: currentLang === "en" ? item.cityName : item.cityJa });
    if (item.forecastSourceType === "city-fallback") return tmpl(tr("spotCityFallback"), { city: currentLang === "en" ? item.cityName : item.cityJa });
    return tr("spotForecastUnavailable");
  }

  function getForecastDateText(item) {
    return item && item.hasForecastDates
      ? (fmtDate(item.bloom) + " → " + fmtDate(item.full))
      : tr("forecastUnavailable");
  }

  function formatForecastDate(date) {
    return (date.getMonth() + 1) + "/" + date.getDate();
  }

  function shiftForecastDate(value, offsetDays) {
    var date = parseMonthDay(value);
    if (!date) return "";
    return formatForecastDate(new Date(date.getTime() + (offsetDays * DAY_MS)));
  }

  function canDisplaySpotDates(spot) {
    return !!(spot && spot.hasForecastDates && (spot.bloom || spot.full));
  }

  function getItemPrimaryName(item) {
    return currentLang === "en" ? item.name : item.ja;
  }

  function getItemSecondaryName(item) {
    return currentLang === "en" ? item.ja : item.name;
  }

  function getSpotAreaHint(name) {
    var match = String(name || "").match(/[\(（]([^()（）]+)[\)）]/);
    return match ? match[1].trim() : "";
  }

  function getSpotAreaDisplay(spot) {
    if (currentLang === "en") return spot.localArea || spot.localAreaJa || "";
    return spot.localAreaJa || spot.localArea || "";
  }

  function getSpotIdentity(cityName, name) {
    return cityName + "|" + String(name || "").toLowerCase().replace(/\s+/g, " ").trim();
  }

  function inferSpotTag(name) {
    var text = String(name || "");
    if (/川|堤|緑道|並木|プロムナード/.test(text)) return "river";
    if (/湖|池/.test(text)) return "lake";
    if (/寺|神社|神宮|宮$|院/.test(text)) return "temple";
    if (/城/.test(text)) return "castle";
    if (/庭園|御苑|園$/.test(text)) return "garden";
    return "park";
  }

  function buildGeneratedSpotOffset(index, rank) {
    var angle = ((rank || (index + 1)) * 41) % 360;
    var radius = 0.04 + (((index % 4) + 1) * 0.018);
    return {
      latOffset: Math.sin(angle * Math.PI / 180) * radius,
      lngOffset: Math.cos(angle * Math.PI / 180) * radius
    };
  }

  function buildSeedSpotRecord(city, parts, index) {
    var alias = SPOT_NAME_ALIASES[parts[2]] || SPOT_NAME_ALIASES[parts[1]] || null;
    return inheritCityForecast({
      id: city.name + "::seed::" + index,
      type: "spot",
      name: parts[1],
      ja: parts[2],
      reg: city.reg,
      regJa: city.regJa,
      cityName: city.name,
      cityJa: city.ja,
      prefecture: "",
      localArea: alias && alias.areaEn ? alias.areaEn : "",
      localAreaJa: alias && alias.areaJa ? alias.areaJa : "",
      lat: city.lat + parseFloat(parts[7]),
      lng: city.lng + parseFloat(parts[8]),
      hasExactCoords: true,
      bloom: "",
      full: "",
      hasLiveDates: false,
      hasForecastDates: false,
      temp: city.temp,
      tip: city.tip,
      featured: parts[4] === "1",
      tag: parts[3],
      spot: parts[1],
      mapsQuery: parts[2] + " " + city.ja,
      order: index,
      rank: null,
      sourceType: "seeded",
      source: tr("forecastPending")
    }, city);
  }

  function buildLoadedSpotRecord(city, row, index) {
    var alias = SPOT_NAME_ALIASES[row.name] || null;
    var areaJa = alias && alias.areaJa ? alias.areaJa : getSpotAreaHint(row.name);
    var area = alias && alias.areaEn ? alias.areaEn : areaJa;
    return inheritCityForecast({
      id: city.name + "::live::" + row.code,
      type: "spot",
      name: alias ? alias.en : row.name,
      ja: alias ? alias.ja : row.name,
      reg: city.reg,
      regJa: city.regJa,
      cityName: city.name,
      cityJa: city.ja,
      prefecture: row.prefecture,
      localArea: row.localArea || area,
      localAreaJa: row.localAreaJa || areaJa,
      lat: row.lat != null ? row.lat : null,
      lng: row.lng != null ? row.lng : null,
      hasExactCoords: row.lat != null && row.lng != null,
      bloom: "",
      full: "",
      hasLiveDates: false,
      hasForecastDates: false,
      temp: city.temp,
      tip: row.description || city.tip,
      featured: true,
      tag: inferSpotTag(alias ? alias.ja : row.name),
      spot: alias ? alias.en : row.name,
      mapsQuery: row.name + " " + row.prefecture,
      order: 1000 + index,
      rank: row.rank,
      sourceType: "loaded",
      source: tr("loadedSource") + " #" + row.rank
    }, city);
  }

  function normalizeNkishouStatus(label) {
    var text = String(label || "");
    if (/満開率|もうすぐ満開/.test(text)) return "full_bloom";
    if (/五分咲|三分咲/.test(text)) return "blooming";
    if (/開花する頃|開花まであと少し/.test(text)) return "budding";
    if (/つぼみ|花芽/.test(text)) return "not_yet";
    return "not_yet";
  }

  function buildLiveSpotRecord(city, row, index) {
    var alias = SPOT_NAME_ALIASES[row.name] || null;
    return inheritCityForecast({
      id: city.name + "::nkishou::" + row.code,
      type: "spot",
      name: alias ? alias.en : row.name,
      ja: alias ? alias.ja : row.name,
      reg: city.reg,
      regJa: city.regJa,
      cityName: city.name,
      cityJa: city.ja,
      prefecture: row.prefecture,
      localArea: row.localArea || (alias && alias.areaEn ? alias.areaEn : ""),
      localAreaJa: row.localAreaJa || (alias && alias.areaJa ? alias.areaJa : ""),
      lat: row.lat != null ? row.lat : null,
      lng: row.lng != null ? row.lng : null,
      hasExactCoords: row.lat != null && row.lng != null,
      bloom: normalizeForecastDate(row.bloom),
      full: normalizeForecastDate(row.full),
      hasLiveDates: !!(row.bloom || row.full),
      hasForecastDates: !!(row.bloom || row.full),
      temp: city.temp,
      tip: row.description || city.tip,
      featured: true,
      tag: inferSpotTag(alias ? alias.ja : row.name),
      spot: alias ? alias.en : row.name,
      mapsQuery: row.name + " " + row.prefecture,
      order: 500 + index,
      rank: row.rank || null,
      sourceType: "live-spot",
      source: "N-kishou live spot forecast",
      code: row.code,
      growthLabel: row.growthLabel,
      liveStatus: normalizeNkishouStatus(row.growthLabel)
    }, city);
  }

  function inheritCityForecast(spot, city) {
    var cityForecastType = city && city.hasForecastDates
      ? (city.forecastSourceType === "city-live" ? "city-live" : "city-fallback")
      : "none";
    if (!hasForecastDates(spot) && cityForecastType !== "none") {
      spot.bloom = city.bloom;
      spot.full = city.full;
    }
    spot.hasForecastDates = hasForecastDates(spot);
    if (spot.hasLiveDates) spot.forecastSourceType = "spot-live";
    else if (spot.hasForecastDates) spot.forecastSourceType = cityForecastType;
    else spot.forecastSourceType = "none";
    return spot;
  }

  function buildSpotRecords(cityList) {
    var cityByName = {};
    cityList.forEach(function(city) {
      cityByName[city.name] = city;
    });
    var merged = {};

    SPOT_ROWS.map(function(row, index) {
      var parts = row.split("|");
      var city = cityByName[parts[0]];
      if (!city) return null;
      return buildSeedSpotRecord(city, parts, index);
    }).filter(Boolean).forEach(function(spot) {
      merged[getSpotIdentity(spot.cityName, spot.name)] = spot;
    });

    liveSpotRows.map(function(row, index) {
      var city = cityByName[PREFECTURE_CITY_MAP[row.prefecture] || ""];
      if (!city) return null;
      return buildLiveSpotRecord(city, row, index);
    }).filter(Boolean).forEach(function(spot) {
      merged[getSpotIdentity(spot.cityName, spot.name)] = spot;
    });

    rankedSpotRows.map(function(row, index) {
      var city = cityByName[PREFECTURE_CITY_MAP[row.prefecture] || ""];
      if (!city) return null;
      return buildLoadedSpotRecord(city, row, index);
    }).filter(Boolean).forEach(function(spot) {
      var key = getSpotIdentity(spot.cityName, spot.name);
      if (!merged[key]) {
        merged[key] = spot;
        return;
      }
      merged[key].featured = true;
      merged[key].rank = merged[key].rank == null ? spot.rank : Math.min(merged[key].rank, spot.rank);
      merged[key].prefecture = merged[key].prefecture || spot.prefecture;
      merged[key].localArea = merged[key].localArea || spot.localArea;
      merged[key].localAreaJa = merged[key].localAreaJa || spot.localAreaJa;
      if (merged[key].sourceType !== "live-spot") {
        merged[key].sourceType = "loaded";
        merged[key].source = tr("loadedSource") + " #" + merged[key].rank;
      }
    });

    return Object.keys(merged).map(function(key) {
      return merged[key];
    }).sort(function(a, b) {
      if ((a.rank != null) !== (b.rank != null)) return a.rank != null ? -1 : 1;
      if (a.rank != null && b.rank != null && a.rank !== b.rank) return a.rank - b.rank;
      if (a.featured !== b.featured) return a.featured ? -1 : 1;
      return a.order - b.order;
    });
  }

  function getCitySpots(cityName) {
    return spotsByCityName[cityName] ? spotsByCityName[cityName].slice() : [];
  }

  function getFilteredSpots() {
    var cacheKey = [
      derivedStateVersion,
      currentDate.getTime(),
      currentLang,
      activeRegion,
      activeSpotTag,
      activeSpotTiming,
      activeSpotSource,
      searchTerm.toLowerCase()
    ].join("|");
    if (cacheKey === filteredSpotsCacheKey) return filteredSpotsCacheValue;

    var term = searchTerm.toLowerCase();
    filteredSpotsCacheKey = cacheKey;
    filteredSpotsCacheValue = spots.filter(function(spot) {
      var regionMatch = activeRegion === "All" || spot.reg === activeRegion;
      var tagMatch = activeSpotTag === "all" || spot.tag === activeSpotTag;
      var timingMatch = activeSpotTiming === "all" || getSpotTimingBucket(spot) === activeSpotTiming;
      var sourceMatch = activeSpotSource === "all" ||
        (activeSpotSource === "loaded" && spot.sourceType === "loaded") ||
        (activeSpotSource === "seeded" && spot.sourceType === "seeded") ||
        (activeSpotSource === "popular" && spot.featured);
      var searchMatch = !term ||
        spot.name.toLowerCase().indexOf(term) !== -1 ||
        spot.ja.indexOf(term) !== -1 ||
        spot.cityName.toLowerCase().indexOf(term) !== -1 ||
        spot.cityJa.indexOf(term) !== -1 ||
        String(spot.prefecture || "").indexOf(term) !== -1 ||
        String(spot.localArea || "").toLowerCase().indexOf(term) !== -1 ||
        String(spot.localAreaJa || "").indexOf(term) !== -1 ||
        getRegionDisplay(spot.reg).toLowerCase().indexOf(term) !== -1 ||
        getSpotTagLabel(spot.tag).toLowerCase().indexOf(term) !== -1;
      return regionMatch && tagMatch && timingMatch && sourceMatch && searchMatch;
    });
    return filteredSpotsCacheValue;
  }

  function getSpotGuideUrl() {
    if (currentLang === "ja") return OFFICIAL_SAKURA_JA_URL;
    if (currentLang === "zh-Hant") return OFFICIAL_SAKURA_ZH_URL;
    return OFFICIAL_SAKURA_EN_URL;
  }

  function buildMapsUrl(city) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(city.mapsQuery || (city.spot + " " + city.name + " Japan"));
  }

  function buildSpotLinks(city) {
    return '<div class="popup-links">' +
      '<a href="' + getSpotGuideUrl() + '" target="_blank" rel="noopener">' + escapeHtml(tr("officialGuide")) + '</a>' +
      '<a href="' + buildMapsUrl(city) + '" target="_blank" rel="noopener">' + escapeHtml(tr("mapsLink")) + '</a>' +
      '<a href="' + OFFICIAL_SAKURA_JA_URL + '" target="_blank" rel="noopener">' + escapeHtml(tr("allSpots")) + '</a>' +
    '</div>';
  }

  function updateStaticTranslations() {
    document.documentElement.lang = currentLang;
    var appTitle = document.getElementById("appTitle");
    if (appTitle) appTitle.innerHTML = tr("appTitle");
    var legendToggle = document.getElementById("legendToggle");
    if (legendToggle) legendToggle.innerHTML = '<i class="fa-solid fa-circle-info"></i> ' + escapeHtml(tr("legendButton"));
    var legendTitle = document.getElementById("legendTitle");
    if (legendTitle) legendTitle.textContent = tr("legendTitle");
    var searchInput = document.getElementById("searchInput");
    if (searchInput) searchInput.placeholder = tr("searchPlaceholder");
    document.querySelectorAll(".view-btn").forEach(function(button) {
      button.textContent = button.dataset.view === "spots" ? tr("spotsView") : tr("citiesView");
      button.classList.toggle("active", button.dataset.view === listMode);
    });
    document.querySelectorAll("[data-legend]").forEach(function(node) {
      node.textContent = tr("statuses." + node.dataset.legend);
    });
    document.querySelectorAll(".lang-btn").forEach(function(button) {
      button.classList.toggle("active", button.dataset.lang === currentLang);
    });
  }

  function renderSpotFilters() {
    var container = document.getElementById("spotFilters");
    if (!container) return;
    container.classList.toggle("hidden", listMode !== "spots");
    if (listMode !== "spots") {
      container.innerHTML = "";
      return;
    }
    if (!spots.length) {
      container.innerHTML = "";
      return;
    }

    container.innerHTML = '<div class="spot-filter-group">' +
      '<div class="spot-filter-label">' + escapeHtml(tr("filterType")) + '</div>' +
      '<div class="spot-filter-row">' +
        SPOT_TAG_ORDER.map(function(tag) {
          var label = tag === "all" ? tr("filterAllTypes") : getSpotTagLabel(tag);
          return '<button class="spot-filter-pill' + (activeSpotTag === tag ? ' active' : '') + '" data-filter-kind="tag" data-filter-value="' + escapeHtml(tag) + '">' + escapeHtml(label) + '</button>';
        }).join("") +
      '</div>' +
    '</div>' +
    '<div class="spot-filter-group">' +
      '<div class="spot-filter-label">' + escapeHtml(tr("filterTiming")) + '</div>' +
      '<div class="spot-filter-row">' +
        SPOT_TIMING_ORDER.map(function(timing) {
          var label = timing === "all" ? tr("filterAllTiming") : getSpotTimingLabel(timing);
          return '<button class="spot-filter-pill' + (activeSpotTiming === timing ? ' active' : '') + '" data-filter-kind="timing" data-filter-value="' + escapeHtml(timing) + '">' + escapeHtml(label) + '</button>';
        }).join("") +
      '</div>' +
    '</div>' +
    '<div class="spot-filter-group">' +
      '<div class="spot-filter-label">' + escapeHtml(tr("filterSource")) + '</div>' +
      '<div class="spot-filter-row">' +
        SPOT_SOURCE_ORDER.map(function(sourceKey) {
          var label = sourceKey === "all" ? tr("filterAllSources") : getSpotSourceFilterLabel(sourceKey);
          return '<button class="spot-filter-pill' + (activeSpotSource === sourceKey ? ' active' : '') + '" data-filter-kind="source" data-filter-value="' + escapeHtml(sourceKey) + '">' + escapeHtml(label) + '</button>';
        }).join("") +
      '</div>' +
    '</div>';

    container.querySelectorAll(".spot-filter-pill").forEach(function(button) {
      button.addEventListener("click", function() {
        if (button.dataset.filterKind === "tag") {
          activeSpotTag = button.dataset.filterValue;
        } else if (button.dataset.filterKind === "source") {
          activeSpotSource = button.dataset.filterValue;
        } else {
          activeSpotTiming = button.dataset.filterValue;
        }
        invalidateDerivedState();
        scheduleRender({ spotFilters: true, cityList: true, statBar: true, markers: true, mapInfo: true, fit: true });
      });
    });
  }

  function makeFixedDate(year, month, day) {
    return new Date(year, month - 1, day, 12, 0, 0, 0);
  }

  function cloneDate(date) {
    return new Date(date.getTime());
  }

  function clampDate(date) {
    var normalized = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0, 0);
    if (normalized < SLIDER_START) return cloneDate(SLIDER_START);
    if (normalized > SLIDER_END) return cloneDate(SLIDER_END);
    return normalized;
  }

  function sliderOffsetToDate(offset) {
    return new Date(SLIDER_START.getTime() + (offset * DAY_MS));
  }

  function dateToSliderOffset(date) {
    return Math.round((clampDate(date).getTime() - SLIDER_START.getTime()) / DAY_MS);
  }

  function parseMonthDay(value) {
    var match = String(value || "").trim().match(/^(\d{1,2})\/(\d{1,2})$/);
    if (!match) return null;
    return makeFixedDate(SEASON_YEAR, parseInt(match[1], 10), parseInt(match[2], 10));
  }

  function normalizeForecastDate(value) {
    var text = String(value || "").trim();
    return text && text !== "---" ? text : "";
  }

  function forecastSortValue(value) {
    var match = String(value || "").match(/^(\d{1,2})\/(\d{1,2})$/);
    if (!match) return 999999;
    return (parseInt(match[1], 10) * 100) + parseInt(match[2], 10);
  }

  function daysBetween(fromDate, toDate) {
    return Math.round((toDate.getTime() - fromDate.getTime()) / DAY_MS);
  }

  function pluralizeDays(days) {
    return days === 1 ? "day" : "days";
  }

  function formatDisplayDate(date) {
    return date.toLocaleDateString(getLocale(), { month: "long", day: "numeric" });
  }

  function fmtDate(value) {
    return value || "—";
  }

  function buildFallbackCities() {
    return CITY_ROWS.map(function(row, index) {
      var parts = row.split("|");
      return {
        type: "city",
        name: parts[0],
        ja: parts[1],
        reg: parts[2],
        regJa: REGION_META[parts[2]].ja,
        lat: parseFloat(parts[3]),
        lng: parseFloat(parts[4]),
        spot: parts[5],
        mapsQuery: parts[5] + " " + parts[0] + " Japan",
        temp: parts[6],
        bloom: normalizeForecastDate(parts[7]),
        full: normalizeForecastDate(parts[8]),
        hasLiveDates: false,
        liveSources: [],
        tip: REGION_META[parts[2]].tip,
        order: index
      };
    });
  }

  function buildCity(baseCity, liveRow) {
    var liveBloom = liveRow ? normalizeForecastDate(liveRow.bloom) : "";
    var liveFull = liveRow ? normalizeForecastDate(liveRow.full) : "";
    var liveSources = liveRow && liveRow.sources ? liveRow.sources.slice() : [];
    var hasLiveDates = !!(liveBloom || liveFull);
    var fallbackBloom = normalizeForecastDate(baseCity.bloom);
    var fallbackFull = normalizeForecastDate(baseCity.full);
    var bloom = liveBloom || fallbackBloom || "";
    var full = liveFull || fallbackFull || "";
    var hasForecastDates = !!(bloom || full);
    return {
      type: "city",
      name: baseCity.name,
      ja: baseCity.ja,
      reg: baseCity.reg,
      regJa: baseCity.regJa,
      lat: baseCity.lat,
      lng: baseCity.lng,
      bloom: bloom,
      full: full,
      hasLiveDates: hasLiveDates,
      hasForecastDates: hasForecastDates,
      forecastSourceType: hasLiveDates ? "city-live" : (hasForecastDates ? "city-fallback" : "none"),
      liveSources: liveSources,
      spot: baseCity.spot,
      mapsQuery: baseCity.mapsQuery,
      temp: baseCity.temp,
      tip: baseCity.tip,
      order: baseCity.order,
      source: hasLiveDates
        ? (liveSources.length > 1 ? "WeatherMap + N-kishou live forecast" : (liveSources[0] === "nkishou" ? "N-kishou live forecast" : "WeatherMap live forecast"))
        : (hasForecastDates ? tr("fallbackCityForecast") : tr("forecastUnavailable"))
    };
  }

  function rebuildSpots() {
    spots = buildSpotRecords(cities);
    spotsByCityName = buildSpotIndex(spots);
    invalidateDerivedState();
  }

  function setCities(nextCities) {
    cities = nextCities.slice();
    rebuildSpots();
    invalidateDerivedState();
    regions = ["All"].concat(REGION_ORDER.filter(function(region) {
      return cities.some(function(city) { return city.reg === region; });
    }));
  }

  function getForecastWindow(city) {
    var bloomDate = parseMonthDay(city.bloom);
    var fullDate = parseMonthDay(city.full);
    if (!bloomDate && fullDate) bloomDate = new Date(fullDate.getTime() - (6 * DAY_MS));
    if (bloomDate && !fullDate) fullDate = new Date(bloomDate.getTime() + (6 * DAY_MS));
    return {
      bloom: bloomDate,
      full: fullDate,
      start: bloomDate ? new Date(bloomDate.getTime() - (10 * DAY_MS)) : null,
      end: fullDate ? new Date(fullDate.getTime() + (9 * DAY_MS)) : null
    };
  }

  function getStatus(city) {
    var window = getForecastWindow(city);
    if (!window.bloom) return "pending";
    if (currentDate < window.start) return "not_yet";
    if (currentDate < window.bloom) return "budding";
    if (currentDate < window.full) return "blooming";
    if (currentDate <= new Date(window.full.getTime() + (2 * DAY_MS))) return "full_bloom";
    if (currentDate <= window.end) return "falling";
    return "ended";
  }

  function getProgress(city) {
    var window = getForecastWindow(city);
    if (!window.start || !window.end) return 0;
    var total = window.end.getTime() - window.start.getTime();
    if (total <= 0) return 0;
    var elapsed = currentDate.getTime() - window.start.getTime();
    var ratio = Math.max(0, Math.min(1, elapsed / total));
    return Math.round(ratio * 100);
  }

  function getCountdownShort(city) {
    var window = getForecastWindow(city);
    if (!window.bloom) return tr("forecastPending");

    if (currentDate < window.bloom) {
      var bloomDiff = daysBetween(currentDate, window.bloom);
      return bloomDiff === 0 ? tr("expectedToday") : tmpl(tr("bloomIn"), { days: bloomDiff, unit: getPluralDayLabel(bloomDiff) });
    }
    if (currentDate < window.full) {
      var fullDiff = daysBetween(currentDate, window.full);
      return fullDiff === 0 ? tr("peakToday") : tmpl(tr("fullIn"), { days: fullDiff, unit: getPluralDayLabel(fullDiff) });
    }
    if (currentDate <= new Date(window.full.getTime() + (2 * DAY_MS))) return tr("peakNow");
    if (currentDate <= window.end) return tr("petalsFalling");
    return tr("bloomOver");
  }

  function getCountdown(city) {
    var window = getForecastWindow(city);
    if (!window.bloom) return tr("noBloomDate");

    if (currentDate < window.bloom) {
      var bloomDiff = daysBetween(currentDate, window.bloom);
      return bloomDiff === 0 ? tr("firstBloomToday") : tmpl(tr("firstBloomIn"), { days: bloomDiff, unit: getPluralDayLabel(bloomDiff) });
    }
    if (currentDate < window.full) {
      var fullDiff = daysBetween(currentDate, window.full);
      return fullDiff === 0 ? tr("fullBloomToday") : tmpl(tr("fullBloomIn"), { days: fullDiff, unit: getPluralDayLabel(fullDiff) });
    }
    if (currentDate <= new Date(window.full.getTime() + (2 * DAY_MS))) return tr("bestWindow");
    if (currentDate <= window.end) return tr("visitSoon");
    return tr("seasonDone");
  }

  function getColor(statusKey) {
    var prop = statusMeta[statusKey].color;
    return getComputedStyle(document.documentElement).getPropertyValue(prop).trim();
  }

  function getFilteredCities() {
    var cacheKey = [
      derivedStateVersion,
      currentLang,
      activeRegion,
      searchTerm.toLowerCase()
    ].join("|");
    if (cacheKey === filteredCitiesCacheKey) return filteredCitiesCacheValue;

    var term = searchTerm.toLowerCase();
    filteredCitiesCacheKey = cacheKey;
    filteredCitiesCacheValue = cities.filter(function(city) {
      var regionMatch = activeRegion === "All" || city.reg === activeRegion;
      var searchMatch = !term ||
        city.name.toLowerCase().indexOf(term) !== -1 ||
        city.ja.indexOf(term) !== -1 ||
        city.reg.toLowerCase().indexOf(term) !== -1 ||
        city.regJa.indexOf(term) !== -1 ||
        getRegionDisplay(city.reg).toLowerCase().indexOf(term) !== -1 ||
        city.spot.toLowerCase().indexOf(term) !== -1;
      return regionMatch && searchMatch;
    });
    return filteredCitiesCacheValue;
  }

  function normalizeLine(line) {
    return String(line || "")
      .replace(/\u00a0/g, " ")
      .replace(/(\d{1,2}\/\d{1,2})(---)/g, "$1 $2")
      .replace(/\s+/g, " ")
      .trim();
  }

  function extractDates(text) {
    return normalizeLine(text).match(/\d{1,2}\/\d{1,2}|---/g) || [];
  }

  function parseKnownCityLine(line, nextLine) {
    for (var i = 0; i < KNOWN_CITY_NAMES.length; i++) {
      var name = KNOWN_CITY_NAMES[i];
      if (line === name) {
        var nextDates = extractDates(nextLine);
        if (nextDates.length >= 2) {
          return { name: name, bloom: nextDates[0], full: nextDates[1], consumedNext: true };
        }
      }
      if (line.indexOf(name + " ") === 0) {
        var tail = line.slice(name.length + 1);
        var dates = extractDates(tail);
        if (dates.length >= 2) {
          return { name: name, bloom: dates[0], full: dates[1], consumedNext: false };
        }
        if (dates.length === 1) {
          var fallbackDates = extractDates(nextLine);
          if (fallbackDates.length >= 1) {
            return { name: name, bloom: dates[0], full: fallbackDates[0], consumedNext: true };
          }
        }
      }
    }
    return null;
  }

  async function fetchText(url, options) {
    var cacheKey = options && options.cacheKey ? options.cacheKey : url;
    var maxAgeMs = options && options.maxAgeMs ? options.maxAgeMs : 0;
    var cachedText = readCachedText(cacheKey, maxAgeMs);
    if (cachedText) return cachedText;

    var controller = new AbortController();
    var externalSignal = createAbortSignal(options);
    var timeoutId = window.setTimeout(function() {
      controller.abort(new DOMException("Request timed out", "AbortError"));
    }, (options && options.timeoutMs) || FETCH_TIMEOUT_MS);

    function abortFromExternal() {
      controller.abort(externalSignal && externalSignal.reason ? externalSignal.reason : new DOMException("Request aborted", "AbortError"));
    }

    if (externalSignal) {
      if (externalSignal.aborted) abortFromExternal();
      else externalSignal.addEventListener("abort", abortFromExternal, { once: true });
    }

    try {
      var response = await fetch(url, { mode: "cors", cache: maxAgeMs ? "default" : "no-store", signal: controller.signal });
      if (!response.ok) throw new Error("Failed to load live Sakura forecast data.");
      var text = await response.text();
      if (maxAgeMs) writeCachedText(cacheKey, text);
      return text;
    } finally {
      window.clearTimeout(timeoutId);
      if (externalSignal) externalSignal.removeEventListener("abort", abortFromExternal);
    }
  }

  function parseWeatherMapText(text) {
    var rowsByName = {};
    var lines = String(text || "").split(/\r?\n/);

    function storeRow(row) {
      var existing = rowsByName[row.name];
      if (!existing) {
        rowsByName[row.name] = row;
        return;
      }
      if ((!existing.full && row.full) || (!existing.bloom && row.bloom)) {
        rowsByName[row.name] = row;
      }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = normalizeLine(lines[i]);
      if (!line) continue;
      var parsed = parseKnownCityLine(line, normalizeLine(lines[i + 1] || ""));
      if (!parsed) continue;
      storeRow({
        name: parsed.name,
        bloom: normalizeForecastDate(parsed.bloom),
        full: normalizeForecastDate(parsed.full)
      });
      if (parsed.consumedNext) i += 1;
    }

    return Object.keys(rowsByName).map(function(name) {
      return rowsByName[name];
    });
  }

  function parseNKishouCityText(text) {
    var rowsByName = {};
    var lines = String(text || "").split(/\r?\n/);
    var currentCity = "";

    function storeRow(name, bloom, full) {
      if (!name) return;
      rowsByName[name] = {
        name: name,
        bloom: normalizeForecastDate(bloom),
        full: normalizeForecastDate(full)
      };
    }

    for (var i = 0; i < lines.length; i++) {
      var line = normalizeLine(lines[i]);
      if (!line) continue;

      for (var j = 0; j < KNOWN_CITY_NAMES.length; j++) {
        if (line === KNOWN_CITY_NAMES[j]) {
          currentCity = KNOWN_CITY_NAMES[j];
          break;
        }
      }
      if (!currentCity) continue;

      if (line.indexOf("開花") !== -1) {
        var bloomDates = extractDates(line + " " + normalizeLine(lines[i + 1] || ""));
        var bloom = bloomDates[0] || "";
        var full = "";
        for (var k = i + 1; k < Math.min(lines.length, i + 6); k++) {
          var candidate = normalizeLine(lines[k]);
          if (candidate.indexOf("満開") !== -1) {
            var fullDates = extractDates(candidate + " " + normalizeLine(lines[k + 1] || ""));
            full = fullDates[0] || "";
            break;
          }
        }
        if (bloom || full) storeRow(currentCity, bloom, full);
      }
    }

    return Object.keys(rowsByName).map(function(name) {
      return rowsByName[name];
    });
  }

  function mergeLiveRows(sourceName, rows, target) {
    rows.forEach(function(row) {
      if (!row || !row.name) return;
      var existing = target[row.name] || { name: row.name, bloom: "", full: "", sources: [] };
      if (row.bloom) existing.bloom = row.bloom;
      if (row.full) existing.full = row.full;
      if (existing.sources.indexOf(sourceName) === -1) existing.sources.push(sourceName);
      target[row.name] = existing;
    });
  }

  function extractSourceUpdate(text) {
    var lines = String(text || "").split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      var match = line.match(/^Updated\s+(.+)$/i);
      if (match) return match[1].replace(/\s+/g, " ");
    }
    return "";
  }

  function parseRankingText(text, defaultPrefecture) {
    var collapsed = String(text || "").replace(/\s+/g, " ");
    var regex = /\[(\d+)位\s*(.+?)(?:\((北海道|東京都|京都府|大阪府|[^()]+県)\))?\]\(http:\/\/s\.n-kishou\.co\.jp\/w\/sp\/sakura\/sakurad\?code=(\d+)\)/g;
    var seen = {};
    var rows = [];
    var match;

    while ((match = regex.exec(collapsed))) {
      var key = match[4];
      var prefecture = (match[3] || defaultPrefecture || "").trim();
      if (!prefecture) continue;
      if (seen[key]) continue;
      seen[key] = true;
      rows.push({
        rank: parseInt(match[1], 10),
        name: match[2].trim(),
        prefecture: prefecture,
        code: match[4]
      });
    }

    return rows;
  }

  function parseNkishouSpotText(text, prefecture) {
    var body = String(text || "");
    var headingRegex = /(?:^|\n)\s*(?:\*\s*)?###\s+([^\n]+)/g;
    var rows = [];
    var seen = {};
    var matches = [];
    var match;

    while ((match = headingRegex.exec(body))) {
      matches.push({ index: match.index, name: normalizeLine(match[1]).replace(/^\*\s*/, "").trim() });
    }

    matches.forEach(function(entry, index) {
      var nextIndex = index + 1 < matches.length ? matches[index + 1].index : body.length;
      var sectionStart = Math.max(0, entry.index - 220);
      var section = body.slice(sectionStart, nextIndex);
      var growthMatch = section.match(/##\s*\[([^\]]+)\]/);
      var bloomMatch = section.match(/\|\s*開花(?:予想)?日(?:\s*\(平年\))?\s*\|[\s\S]{0,40}?(---|\d{1,2}\/\d{1,2})/);
      var fullMatch = section.match(/\|\s*満開予想日(?:\s*\(平年\))?\s*\|[\s\S]{0,40}?(---|\d{1,2}\/\d{1,2})/);
      var codeMatch = section.match(/sakurad\?code=(\d+)/);
      var name = entry.name;
      var code = (codeMatch && codeMatch[1]) || (prefecture + "-" + name);
      if (!name || seen[code]) return;
      seen[code] = true;
      rows.push({
        prefecture: prefecture,
        growthLabel: normalizeLine((growthMatch && growthMatch[1]) || ""),
        name: name,
        bloom: bloomMatch && bloomMatch[1] !== "---" ? bloomMatch[1] : "",
        full: fullMatch && fullMatch[1] !== "---" ? fullMatch[1] : "",
        code: code
      });
    });

    return rows;
  }

  function parseNkishouSpotDetailText(text, code) {
    var body = String(text || "");
    if (!body || /今シーズンの情報は入ってきておりません/.test(body)) return null;

    var nameMatch = body.match(/##\s*([^\n]+)\n\n###\s*現在の開花状況/);
    var areaMatch = body.match(/\n\d+\.\s*\[([^\]]+)\]\(https?:\/\/s\.n-kishou\.co\.jp\/w\/sp\/sakura\/sakurasel[^\)]*\)[\s\S]{0,80}?\n\d+\.\s*([^\n]+)/);
    var addressMatch = body.match(/\|\s*住所\s*\|\s*([^\n|]+)/);
    var coordsMatch = body.match(/maps\.google\.co\.jp\/maps\?q=([0-9.\-]+),([0-9.\-]+)/i);
    var descriptionMatch = body.match(/###\s*現在の開花状況[\s\S]*?UP\s*\n\n([\s\S]*?)\n\n\*/);
    var areaText = areaMatch ? normalizeLine(areaMatch[1]) : "";
    var addressText = addressMatch ? normalizeLine(addressMatch[1]) : "";
    var prefMatch = (areaText || addressText).match(/^(北海道|東京都|京都府|大阪府|[^\s]+県)\s*(.*)$/);

    return {
      code: code,
      name: normalizeLine((nameMatch && nameMatch[1]) || (areaMatch && areaMatch[2]) || ""),
      prefecture: prefMatch ? prefMatch[1] : "",
      localAreaJa: prefMatch ? prefMatch[2].trim() : "",
      localArea: prefMatch ? prefMatch[2].trim() : "",
      description: descriptionMatch ? normalizeLine(descriptionMatch[1]) : "",
      lat: coordsMatch ? parseFloat(coordsMatch[1]) : null,
      lng: coordsMatch ? parseFloat(coordsMatch[2]) : null
    };
  }

  function enrichSpotRowsWithDetails(rows) {
    return rows.map(function(row) {
      var detail = spotDetailCache[row.code];
      if (!detail) return row;
      return {
        rank: row.rank,
        growthLabel: row.growthLabel,
        name: detail.name || row.name,
        prefecture: detail.prefecture || row.prefecture,
        bloom: row.bloom,
        full: row.full,
        code: row.code,
        localArea: detail.localArea || row.localArea || "",
        localAreaJa: detail.localAreaJa || row.localAreaJa || "",
        description: detail.description || row.description || "",
        lat: detail.lat != null ? detail.lat : row.lat,
        lng: detail.lng != null ? detail.lng : row.lng
      };
    });
  }

  async function prefetchSpotDetails(codes, options) {
    var queue = codes.filter(function(code) {
      return code && !Object.prototype.hasOwnProperty.call(spotDetailCache, code);
    });
    var signal = createAbortSignal(options);

    spotDataState.loaded = 0;
    spotDataState.total = queue.length;
    updateLoadingStatus();

    if (!queue.length) return;
    await runThrottledTasks(queue, SPOT_DETAIL_CONCURRENCY, async function(code) {
      if (signal && signal.aborted) throw signal.reason || new DOMException("Request aborted", "AbortError");
      try {
        var text = await fetchText("https://r.jina.ai/http://s.n-kishou.co.jp/w/sp/sakura/sakurad?code=" + encodeURIComponent(code), { signal: signal, cacheKey: "detail:" + code, maxAgeMs: SOURCE_CACHE_TTL_MS });
        spotDetailCache[code] = parseNkishouSpotDetailText(text, code);
      } catch (error) {
        if (isAbortError(error)) throw error;
        spotDetailCache[code] = null;
      } finally {
        spotDataState.loaded += 1;
        updateLoadingStatus();
      }
    });
  }

  function getRankingDefaultPrefecture(url) {
    if (String(url).indexOf("ba=hokka") !== -1) return "北海道";
    return "";
  }

  async function loadRankingSpots(options) {
    var signal = createAbortSignal(options);
    var settled = await runThrottledTasks(SPOT_RANKING_URLS, SPOT_BATCH_CONCURRENCY, function(url) {
      return fetchText(url, { signal: signal, cacheKey: "rank:" + url, maxAgeMs: SOURCE_CACHE_TTL_MS }).then(function(text) {
        return { url: url, text: text };
      });
    });
    var merged = {};

    settled.forEach(function(result) {
      if (result.status !== "fulfilled") return;
      parseRankingText(result.value.text, getRankingDefaultPrefecture(result.value.url)).forEach(function(row) {
        if (!PREFECTURE_CITY_MAP[row.prefecture]) return;
        if (!merged[row.code]) merged[row.code] = row;
      });
    });

    rankedSpotRows = Object.keys(merged).map(function(code) {
      return merged[code];
    }).sort(function(a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return a.name.localeCompare(b.name, "ja");
    });
  }

  async function loadLiveSpotForecasts(options) {
    var prefectures = Object.keys(NKISHOU_PREFECTURE_CODES);
    var signal = createAbortSignal(options);
    var settled = await runThrottledTasks(prefectures, SPOT_BATCH_CONCURRENCY, function(prefecture) {
      var url = "https://r.jina.ai/http://s.n-kishou.co.jp/w/sp/sakura/sakura_yosou?ba=" + NKISHOU_PREFECTURE_CODES[prefecture];
      return fetchText(url, { signal: signal, cacheKey: "pref:" + prefecture, maxAgeMs: SOURCE_CACHE_TTL_MS }).then(function(text) {
        return { prefecture: prefecture, text: text };
      });
    });
    var merged = {};

    settled.forEach(function(result) {
      if (result.status !== "fulfilled") return;
      parseNkishouSpotText(result.value.text, result.value.prefecture).forEach(function(row) {
        if (!PREFECTURE_CITY_MAP[row.prefecture]) return;
        if (!merged[row.code]) merged[row.code] = row;
      });
    });

    liveSpotRows = Object.keys(merged).map(function(code) {
      return merged[code];
    });
  }

  async function ensureSpotDataLoaded() {
    if (spotDataState.mode === "loaded") return spots;
    if (spotLoadPromise) return spotLoadPromise;

    var controller = createSpotLoadController();

    spotDataState = { mode: "loading", loaded: 0, total: 0, message: tr("loadingSpots") };
    scheduleRender({ loadingStatus: true, spotFilters: true, cityList: true, statBar: true, mapInfo: true });

    spotLoadPromise = Promise.all([
      loadRankingSpots({ signal: controller.signal }),
      loadLiveSpotForecasts({ signal: controller.signal })
    ]).then(async function() {
      rebuildSpots();
      scheduleRender({ spotFilters: true, cityList: true, statBar: true, markers: true, mapInfo: true, fit: true });

      var uniqueCodes = {};
      rankedSpotRows.forEach(function(row) { if (row.code) uniqueCodes[row.code] = true; });
      liveSpotRows.forEach(function(row) { if (row.code) uniqueCodes[row.code] = true; });
      await prefetchSpotDetails(Object.keys(uniqueCodes), { signal: controller.signal });
      rankedSpotRows = enrichSpotRowsWithDetails(rankedSpotRows);
      liveSpotRows = enrichSpotRowsWithDetails(liveSpotRows);
      spotDataState = { mode: "loaded", loaded: spotDataState.total, total: spotDataState.total, message: "" };
      rebuildSpots();
      renderAll();
      fitVisibleCities();
      return spots;
    }).catch(function(error) {
      if (isAbortError(error)) {
        spotDataState = { mode: "idle", loaded: 0, total: 0, message: "" };
        scheduleRender({ loadingStatus: true, spotFilters: true, cityList: true, statBar: true, mapInfo: true });
        return spots;
      }
      spotDataState = { mode: "error", loaded: 0, total: 0, message: error && error.message ? error.message : tr("noSpots") };
      renderAll();
      return [];
    }).finally(function() {
      if (spotLoadController === controller) spotLoadController = null;
      spotLoadPromise = null;
      updateLoadingStatus();
    });

    return spotLoadPromise;
  }

  function applyLiveRows(liveRows) {
    var liveByName = {};
    liveRows.forEach(function(row) {
      liveByName[row.name] = row;
    });
    setCities(FALLBACK_CITIES.map(function(baseCity) {
      return buildCity(baseCity, liveByName[baseCity.name] || null);
    }));
  }

  async function loadLiveData() {
    try {
      var settled = await Promise.allSettled([
        fetchText(SOURCE_URL, { cacheKey: "city:weathermap", maxAgeMs: SOURCE_CACHE_TTL_MS }),
        fetchText(NKISHOU_CITY_URL, { cacheKey: "city:nkishou", maxAgeMs: SOURCE_CACHE_TTL_MS })
      ]);
      var mergedLive = {};
      var weatherText = "";

      if (settled[0].status === "fulfilled") {
        weatherText = settled[0].value;
        mergeLiveRows("weathermap", parseWeatherMapText(weatherText), mergedLive);
      }
      if (settled[1].status === "fulfilled") {
        mergeLiveRows("nkishou", parseNKishouCityText(settled[1].value), mergedLive);
      }

      var liveRows = Object.keys(mergedLive).map(function(name) { return mergedLive[name]; });
      if (!liveRows.length) throw new Error("No live sakura forecast rows were parsed.");
      applyLiveRows(liveRows);
      return {
        mode: "live",
        updatedText: extractSourceUpdate(weatherText),
        liveCount: liveRows.length,
        message: "Live dates loaded from WeatherMap and N-kishou."
      };
    } catch (error) {
      setCities(FALLBACK_CITIES.map(function(city) {
        return buildCity(city, null);
      }));
      return {
        mode: "fallback",
        updatedText: "",
        liveCount: 0,
        message: error && error.message ? error.message : "Live WeatherMap fetch failed."
      };
    }
  }

  function updateDateDisplay() {
    document.getElementById("dateLabel").textContent = formatDisplayDate(currentDate);
    var yearLabel = document.querySelector(".date-year");
    if (yearLabel) yearLabel.textContent = String(SEASON_YEAR);
    var slider = document.getElementById("dateSlider");
    if (slider) slider.value = String(dateToSliderOffset(currentDate));
  }

  function updateSourceDisplay() {
    var sourceLabel = document.getElementById("sourceLabel");
    if (!sourceLabel) return;

    if (sourceState.mode === "loading") {
      sourceLabel.innerHTML = tr("loadingSource");
      return;
    }

    if (sourceState.mode === "live") {
      sourceLabel.innerHTML = tmpl(tr("liveSource"), {
        updated: sourceState.updatedText ? tmpl(tr("liveUpdated"), { text: escapeHtml(sourceState.updatedText) }) : ""
      });
      return;
    }

    sourceLabel.innerHTML = tr("fallbackSource");
  }

  function updateLoadingStatus() {
    var container = document.getElementById("loadingStatus");
    var label = document.getElementById("loadingStatusLabel");
    var value = document.getElementById("loadingStatusValue");
    var track = document.getElementById("loadingBarTrack");
    var fill = document.getElementById("loadingBarFill");
    if (!container || !label || !value || !track || !fill) return;

    if (sourceState.mode === "loading") {
      container.classList.add("visible");
      label.textContent = tr("loadingCities");
      value.textContent = "";
      track.classList.add("indeterminate");
      fill.style.width = "38%";
      return;
    }

    if (spotDataState.mode === "loading") {
      container.classList.add("visible");
      label.textContent = spotDataState.message || tr("loadingSpots");
      if (spotDataState.total > 0) {
        value.textContent = tmpl(tr("loadingProgress"), { loaded: spotDataState.loaded, total: spotDataState.total });
        track.classList.remove("indeterminate");
        fill.style.width = Math.max(6, Math.round((spotDataState.loaded / spotDataState.total) * 100)) + "%";
      } else {
        value.textContent = "";
        track.classList.add("indeterminate");
        fill.style.width = "38%";
      }
      return;
    }

    container.classList.remove("visible");
    value.textContent = "";
    track.classList.remove("indeterminate");
    fill.style.width = "0%";
  }

  function updateMapInfo() {
    var infoElement = document.getElementById("mapInfo");
    if (!infoElement) return;
    infoElement.classList.toggle("is-loading", (sourceState.mode === "loading" && !cities.length) || (listMode === "spots" && spotDataState.mode === "loading" && !spots.length));

    if (sourceState.mode === "loading" && !cities.length) {
      infoElement.textContent = tr("mapLoading");
      return;
    }
    if (listMode === "spots" && spotDataState.mode === "loading") {
      if (!spots.length) {
        infoElement.textContent = tr("mapLoadingSpots");
        return;
      }
    }
    var visibleItems = listMode === "spots" ? getFilteredSpots() : getFilteredCities();
    var activeCount = visibleItems.filter(function(item) {
      var status = getStatus(item);
      return status === "blooming" || status === "full_bloom";
    }).length;
    var unit = listMode === "spots" ? tr("spotsUnit") : tr("citiesUnit");
    var suffix = sourceState.mode === "live"
      ? (sourceState.updatedText ? tmpl(tr("suffixLiveUpdated"), { text: sourceState.updatedText }) : tr("suffixLive"))
      : (sourceState.mode === "fallback" ? tr("suffixFallback") : tr("suffixLoading"));
    infoElement.textContent = tmpl(tr("mapInfo"), { count: activeCount, unit: unit, date: formatDisplayDate(currentDate), suffix: suffix });
  }

  function isDarkMode() {
    return document.documentElement.classList.contains("dark");
  }

  function isMobileViewport() {
    return window.innerWidth <= 768;
  }

  function getPopupOptions() {
    var horizontalPadding = isMobileViewport() ? 16 : 24;
    var bottomPadding = isMobileViewport() ? Math.max(150, Math.round(window.innerHeight * 0.34)) : 24;
    return {
      closeButton: true,
      className: "sakura-map-popup",
      maxWidth: isMobileViewport() ? Math.min(320, Math.max(220, window.innerWidth - 32)) : 330,
      minWidth: isMobileViewport() ? 0 : 260,
      autoPan: !isMobileViewport(),
      keepInView: !isMobileViewport(),
      autoPanPaddingTopLeft: [horizontalPadding, 16],
      autoPanPaddingBottomRight: [horizontalPadding, bottomPadding]
    };
  }

  function bindPopupTouchLock(marker) {
    marker.on("popupopen", function(event) {
      var popupElement = event.popup && event.popup.getElement ? event.popup.getElement() : null;
      if (!popupElement) return;

      var scrollRegion = popupElement.querySelector(".popup-body") || popupElement;
      [popupElement, scrollRegion].forEach(function(node) {
        L.DomEvent.disableClickPropagation(node);
        L.DomEvent.disableScrollPropagation(node);
        ["touchstart", "touchmove", "pointerdown", "pointermove", "wheel"].forEach(function(type) {
          L.DomEvent.on(node, type, L.DomEvent.stopPropagation);
        });
      });
    });
  }

  function focusMarkerPopup(marker, lat, lng, zoom) {
    if (!marker) return;
    if (map) {
      map.setView([lat, lng], zoom, { animate: true });
      if (isMobileViewport()) {
        map.invalidateSize(false);
      }
    }
    window.setTimeout(function() {
      if (map && isMobileViewport()) {
        map.invalidateSize(false);
      }
      marker.openPopup();
    }, isMobileViewport() ? 260 : 80);
  }

  function buildTileLayer(kind) {
    return L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; CARTO',
      subdomains: "abcd",
      maxZoom: 20
    });
  }

  function handleTileError(event) {
    if (event.tile) {
      event.tile.classList.add("tile-failed");
      event.tile.alt = "";
      event.tile.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
    }
    if (currentBaseLayerKind === "primary" && !tileFallbackApplied) {
      tileFallbackApplied = true;
      setBaseTileLayer("fallback");
      updateMapInfo();
    }
  }

  function setBaseTileLayer(kind) {
    currentBaseLayerKind = kind;
    if (currentTileLayer) map.removeLayer(currentTileLayer);
    currentTileLayer = buildTileLayer(kind);
    currentTileLayer.on("tileerror", handleTileError);
    currentTileLayer.addTo(map);
  }

  /* ── Map ── */
  function initMap() {
    map = L.map("map", {
      center: HOME_VIEW,
      zoom: HOME_ZOOM,
      zoomControl: true,
      attributionControl: true
    });
    setBaseTileLayer("primary");
    cityMarkerLayer = L.layerGroup().addTo(map);
    spotMarkerLayer = L.layerGroup().addTo(map);
  }

  function buildPinHtml(item, kind) {
    var status = getStatus(item);
    var color = getColor(status);
    var shouldPulse = status === "blooming" || status === "full_bloom";
    var isActive = kind === "spot" ? selectedSpot === item.id : selectedCity === item.name;
    return '<div class="map-pin-wrap' + (isActive ? ' active' : '') + '">' +
      '<div class="map-pin' + (kind === "spot" ? ' spot-pin' : '') + (shouldPulse ? ' pulse' : '') + '" style="background:' + color + ';color:' + color + '">' +
        '<div class="map-pin-inner"></div>' +
      '</div>' +
      '<div class="pin-label">' + escapeHtml(getItemPrimaryName(item)) + '</div>' +
    '</div>';
  }

  function getItemSourceLabel(item) {
    if (item.type === "spot") {
      var parts = [];
      if (item.sourceType === "live-spot") {
        parts.push(tr("spotLiveSource"));
        if (item.growthLabel) parts.push(item.growthLabel);
        parts.push(getForecastBasisLabel(item));
        return parts.join(" · ");
      }
      if (item.rank) parts.push(tr("loadedSource") + " #" + item.rank);
      else parts.push(tr("seededSource"));
      parts.push(getForecastBasisLabel(item));
      return parts.join(" · ");
    }
    return item.source;
  }

  function buildSpotPreviewList(cityName) {
    var citySpots = getCitySpots(cityName).slice(0, 4);
    if (!citySpots.length) return "";
    return '<div class="popup-spots">' +
      '<div class="popup-subtitle">' + escapeHtml(tr("featuredSpots")) + '</div>' +
      '<div class="popup-spot-list">' +
        citySpots.map(function(spot) {
          return '<div class="popup-spot-item">' +
            '<div class="popup-spot-top">' +
              '<div>' +
                '<div class="popup-spot-name">' + escapeHtml(getItemPrimaryName(spot)) + '</div>' +
                '<div class="popup-spot-sub">' + escapeHtml(getSpotTagLabel(spot.tag)) + (getSpotAreaDisplay(spot) ? ' · ' + escapeHtml(getSpotAreaDisplay(spot)) : '') + (spot.rank ? ' · #' + spot.rank : '') + (spot.prefecture ? ' · ' + escapeHtml(spot.prefecture) : '') + (spot.featured ? ' · ' + escapeHtml(tr("featuredRanked")) : '') + '</div>' +
              '</div>' +
              '<span class="status-badge status-' + getStatus(spot) + '">' + escapeHtml(tr("statuses." + getStatus(spot))) + '</span>' +
            '</div>' +
            '<div class="popup-spot-forecast">' + escapeHtml(getForecastDateText(spot)) + ' · ' + escapeHtml(getForecastBasisLabel(spot)) + '</div>' +
          '</div>';
        }).join("") +
      '</div>' +
    '</div>';
  }

  function buildPopup(item) {
    var status = getStatus(item);
    var meta = statusMeta[status];
    var progress = getProgress(item);
    var color = getColor(status);
    var titleSub = item.type === "spot"
      ? '<dt>' + escapeHtml(tr("parentCity")) + '</dt><dd>' + escapeHtml(currentLang === "en" ? item.cityName : item.cityJa) + '</dd>'
      : '';
    var spotSection = item.type === "city" ? buildSpotPreviewList(item.name) : "";

    return '<div class="popup-inner">' +
      '<div class="popup-top-band">' +
        '<div class="popup-header">' +
          '<span class="popup-city">' + escapeHtml(getItemPrimaryName(item)) + '</span>' +
          '<span class="popup-ja">' + escapeHtml(getItemSecondaryName(item)) + '</span>' +
        '</div>' +
        '<div class="popup-region-row">' +
          '<span class="popup-region"><i class="fa-solid fa-location-dot"></i> ' + escapeHtml(getRegionDisplay(item.reg)) + '</span>' +
          '<span class="popup-status"><span class="status-badge status-' + status + '">' + meta.icon + ' ' + escapeHtml(tr("statuses." + status)) + '</span></span>' +
        '</div>' +
      '</div>' +
      '<div class="popup-body">' +
        '<div class="popup-progress-section">' +
          '<div class="popup-progress-label"><span>' + escapeHtml(tr("bloomCycle")) + '</span><span style="color:' + color + '">' + progress + '%</span></div>' +
          '<div class="popup-progress-bar"><div class="popup-progress-fill" style="width:' + progress + '%"></div></div>' +
        '</div>' +
        '<dl class="popup-info">' +
          '<dt>' + escapeHtml(tr("firstBloom")) + '</dt><dd>' + escapeHtml(item.hasForecastDates ? fmtDate(item.bloom) : tr("forecastUnavailable")) + '</dd>' +
          '<dt>' + escapeHtml(tr("fullBloom")) + '</dt><dd>' + escapeHtml(item.hasForecastDates ? fmtDate(item.full) : tr("forecastUnavailable")) + '</dd>' +
          '<dt>' + escapeHtml(item.type === "spot" ? tr("spotForecast") : tr("bestSpot")) + '</dt><dd>' + escapeHtml(item.spot) + '</dd>' +
          titleSub +
          (item.type === "spot" && getSpotAreaDisplay(item) ? '<dt>' + escapeHtml(tr("localArea")) + '</dt><dd>' + escapeHtml(getSpotAreaDisplay(item)) + '</dd>' : '') +
          '<dt>' + escapeHtml(tr("region")) + '</dt><dd>' + escapeHtml(getRegionDisplay(item.reg)) + '</dd>' +
          '<dt>' + escapeHtml(tr("weather")) + '</dt><dd>' + escapeHtml(item.temp) + '</dd>' +
          '<dt>' + escapeHtml(tr("source")) + '</dt><dd>' + escapeHtml(getItemSourceLabel(item)) + '</dd>' +
        '</dl>' +
        '<div class="popup-tip"><strong>' + escapeHtml(tr("tip")) + ':</strong> ' + escapeHtml(item.tip) + '</div>' +
        spotSection +
        buildSpotLinks(item.type === "spot" ? { spot: item.spot, name: item.cityName, ja: item.cityJa, mapsQuery: item.mapsQuery } : item) +
        '<div class="popup-countdown">' + escapeHtml(getCountdown(item)) + '</div>' +
      '</div>' +
    '</div>';
  }

  function clearMarkers() {
    cityMarkerMap = {};
    spotMarkerMap = {};
    if (cityMarkerLayer) cityMarkerLayer.clearLayers();
    if (spotMarkerLayer) spotMarkerLayer.clearLayers();
  }

  function buildMarkerIcon(item, kind) {
    return L.divIcon({
      className: "",
      html: buildPinHtml(item, kind),
      iconSize: kind === "spot" ? [16, 23] : [22, 30],
      iconAnchor: kind === "spot" ? [8, 23] : [11, 30],
      popupAnchor: kind === "spot" ? [0, -22] : [0, -30]
    });
  }

  function buildMarkerTooltip(item, kind) {
    var meta = statusMeta[getStatus(item)];
    if (kind === "spot") {
      return getItemPrimaryName(item) + "  —  " + meta.icon + " " + tr("statuses." + getStatus(item));
    }
    return getCityPrimaryName(item) + "  " + getCitySecondaryName(item) + "  —  " + meta.icon + " " + tr("statuses." + getStatus(item));
  }

  function syncMarkerPresentation(marker, item, kind) {
    if (!hasValidCoordinates(item)) return;
    marker.setLatLng([item.lat, item.lng]);
    marker.setIcon(buildMarkerIcon(item, kind));
    if (marker.getPopup()) marker.setPopupContent(buildPopup(item));
    else marker.bindPopup(buildPopup(item), getPopupOptions());
    if (marker.getTooltip()) marker.setTooltipContent(buildMarkerTooltip(item, kind));
    else marker.bindTooltip(buildMarkerTooltip(item, kind), {
      direction: "top",
      offset: kind === "spot" ? [0, -28] : [0, -34],
      className: "sakura-tooltip"
    });
  }

  function addCityMarker(city) {
    var icon = buildMarkerIcon(city, "city");
    var marker = L.marker([city.lat, city.lng], { icon: icon }).addTo(cityMarkerLayer);
    marker.bindPopup(buildPopup(city), getPopupOptions());
    marker.bindTooltip(buildMarkerTooltip(city, "city"), {
      direction: "top",
      offset: [0, -34],
      className: "sakura-tooltip"
    });
    bindPopupTouchLock(marker);
    marker.on("click", function() { selectCity(city.name); });
    cityMarkerMap[city.name] = marker;
    return marker;
  }

  function addSpotMarker(spot) {
    if (!hasValidCoordinates(spot)) return null;
    var icon = buildMarkerIcon(spot, "spot");
    var marker = L.marker([spot.lat, spot.lng], { icon: icon }).addTo(spotMarkerLayer);
    marker.bindPopup(buildPopup(spot), getPopupOptions());
    marker.bindTooltip(buildMarkerTooltip(spot, "spot"), {
      direction: "top",
      offset: [0, -28],
      className: "sakura-tooltip"
    });
    bindPopupTouchLock(marker);
    marker.on("click", function() { selectSpot(spot.id); });
    spotMarkerMap[spot.id] = marker;
    return marker;
  }

  function syncCityMarkers() {
    var activeCityKeys = {};
    cities.forEach(function(city) {
      activeCityKeys[city.name] = true;
      var marker = cityMarkerMap[city.name] || addCityMarker(city);
      syncMarkerPresentation(marker, city, "city");
      if (!cityMarkerLayer.hasLayer(marker)) cityMarkerLayer.addLayer(marker);
    });
    Object.keys(cityMarkerMap).forEach(function(name) {
      if (activeCityKeys[name]) return;
      if (cityMarkerLayer.hasLayer(cityMarkerMap[name])) cityMarkerLayer.removeLayer(cityMarkerMap[name]);
      delete cityMarkerMap[name];
    });
  }

  function syncSpotMarkers() {
    var visibleSpotKeys = {};
    var activeSpotKeys = {};
    spots.forEach(function(spot) {
      activeSpotKeys[spot.id] = true;
    });
    getVisibleSpotsForMap().forEach(function(spot) {
      visibleSpotKeys[spot.id] = true;
      var marker = spotMarkerMap[spot.id] || addSpotMarker(spot);
      if (!marker) return;
      syncMarkerPresentation(marker, spot, "spot");
      if (!spotMarkerLayer.hasLayer(marker)) spotMarkerLayer.addLayer(marker);
    });
    Object.keys(spotMarkerMap).forEach(function(id) {
      if (!activeSpotKeys[id]) {
        if (spotMarkerLayer.hasLayer(spotMarkerMap[id])) spotMarkerLayer.removeLayer(spotMarkerMap[id]);
        delete spotMarkerMap[id];
        return;
      }
      if (!visibleSpotKeys[id] && spotMarkerLayer.hasLayer(spotMarkerMap[id])) {
        spotMarkerLayer.removeLayer(spotMarkerMap[id]);
      }
    });
  }

  function getVisibleSpotsForMap() {
    if (listMode === "spots") return getFilteredSpots().filter(hasValidCoordinates);
    if (selectedCity) return getCitySpots(selectedCity).filter(hasValidCoordinates);
    return [];
  }

  function populateMarkers() {
    if (sourceState.mode === "loading" && !cities.length) {
      clearMarkers();
      return;
    }
    syncCityMarkers();
    syncSpotMarkers();
  }

  function refreshMarkers() {
    populateMarkers();
  }

  function fitVisibleCities() {
    var visibleItems = (listMode === "spots" ? getFilteredSpots() : getFilteredCities()).filter(hasValidCoordinates);
    if (!visibleItems.length) {
      map.setView(HOME_VIEW, HOME_ZOOM);
      return;
    }
    var bounds = L.latLngBounds(visibleItems.map(function(item) {
      return [item.lat, item.lng];
    }));
    map.fitBounds(bounds.pad(0.18));
  }

  /* ── Sidebar ── */
  function renderRegionFilters() {
    var container = document.getElementById("regionFilters");
    container.innerHTML = regions.map(function(region) {
      return '<button class="region-pill' + (region === activeRegion ? ' active' : '') + '" data-region="' + escapeHtml(region) + '">' + escapeHtml(getRegionDisplay(region)) + '</button>';
    }).join("");
    container.querySelectorAll(".region-pill").forEach(function(button) {
      button.addEventListener("click", function() {
        activeRegion = button.dataset.region;
        invalidateDerivedState();
        scheduleRender({ regions: true, spotFilters: true, cityList: true, statBar: true, markers: true, mapInfo: true, fit: true });
      });
    });
  }

  function buildCityCard(city, index) {
    var status = getStatus(city);
    var meta = statusMeta[status];
    var color = getColor(status);
    var citySpots = getCitySpots(city.name);
    var preview = citySpots.slice(0, 3).map(function(spot) {
      return '<span class="spot-chip">📍 ' + escapeHtml(getItemPrimaryName(spot)) + '</span>';
    }).join("");
    return '<div class="city-card' + (selectedCity === city.name && listMode === "cities" ? ' selected' : '') + '" data-city="' + escapeHtml(city.name) + '" style="animation-delay:' + (index * 0.025) + 's">' +
      '<div class="city-card-top">' +
        '<div class="city-name-wrap">' +
          '<span class="card-dot" style="background:' + color + '"></span>' +
          '<span class="city-name">' + escapeHtml(getCityPrimaryName(city)) + '</span>' +
          '<span class="city-name-ja">' + escapeHtml(getCitySecondaryName(city)) + '</span>' +
        '</div>' +
        '<span class="status-badge status-' + status + '">' + meta.icon + ' ' + escapeHtml(tr("statuses." + status)) + '</span>' +
      '</div>' +
      '<div class="city-card-mid">' +
        '<span>🌸 ' + escapeHtml(getForecastDateText(city)) + '</span>' +
        '<span class="temp">' + escapeHtml(getRegionDisplay(city.reg)) + '</span>' +
      '</div>' +
      '<div class="city-spot">📍 ' + escapeHtml(city.spot) + '</div>' +
      (preview ? '<div class="city-spots-preview">' + preview + '</div>' : '') +
      '<div class="city-countdown">' + escapeHtml(getCountdownShort(city)) + '</div>' +
    '</div>';
  }

  function buildSpotCard(spot, index) {
    var status = getStatus(spot);
    var meta = statusMeta[status];
    var color = getColor(status);
    return '<div class="city-card' + (selectedSpot === spot.id ? ' selected' : '') + '" data-spot="' + escapeHtml(spot.id) + '" style="animation-delay:' + (index * 0.02) + 's">' +
      '<div class="city-card-top">' +
        '<div class="city-name-wrap">' +
          '<span class="card-dot" style="background:' + color + '"></span>' +
          '<span class="city-name">' + escapeHtml(getItemPrimaryName(spot)) + '</span>' +
          '<span class="city-name-ja">' + escapeHtml(getItemSecondaryName(spot)) + '</span>' +
        '</div>' +
        '<span class="status-badge status-' + status + '">' + meta.icon + ' ' + escapeHtml(tr("statuses." + status)) + '</span>' +
      '</div>' +
      '<div class="spot-card-parent">' + escapeHtml(tr("parentCity")) + ': ' + escapeHtml(currentLang === "en" ? spot.cityName : spot.cityJa) + ' · ' + escapeHtml(getRegionDisplay(spot.reg)) + (getSpotAreaDisplay(spot) ? ' · ' + escapeHtml(getSpotAreaDisplay(spot)) : '') + '</div>' +
      '<div class="city-card-mid">' +
        '<span>🌸 ' + escapeHtml(getForecastDateText(spot)) + '</span>' +
        '<span class="temp">' + escapeHtml(getForecastBasisLabel(spot)) + '</span>' +
      '</div>' +
      '<div class="spot-card-meta">' +
        '<span class="spot-chip">' + escapeHtml(getSpotTagLabel(spot.tag)) + '</span>' +
        (getSpotAreaDisplay(spot) ? '<span class="spot-chip">' + escapeHtml(getSpotAreaDisplay(spot)) + '</span>' : '') +
        (spot.prefecture ? '<span class="spot-chip">' + escapeHtml(spot.prefecture) + '</span>' : '') +
        (spot.rank ? '<span class="spot-chip">#' + spot.rank + ' ' + escapeHtml(tr("rank")) + '</span>' : '') +
        '<span class="spot-chip">' + escapeHtml(getSpotSourceDisplay(spot)) + '</span>' +
        '<span class="spot-chip">' + escapeHtml(getForecastBasisLabel(spot)) + '</span>' +
        (spot.featured ? '<span class="spot-chip">★ ' + escapeHtml(tr("featuredRanked")) + '</span>' : '') +
      '</div>' +
      '<div class="city-countdown">' + escapeHtml(getCountdownShort(spot)) + '</div>' +
    '</div>';
  }

  function renderCityList() {
    var container = document.getElementById("cityList");
    if (sourceState.mode === "loading" && !cities.length) {
      container.innerHTML = '<div class="no-results"><i class="fa-solid fa-spinner fa-spin"></i>' + escapeHtml(tr("loadingCities")) + '</div>';
      return;
    }
    if (listMode === "spots" && spotDataState.mode === "loading" && !spots.length) {
      container.innerHTML = '<div class="no-results"><i class="fa-solid fa-spinner fa-spin"></i>' + escapeHtml(tr("loadingSpots")) + '</div>';
      return;
    }
    var sorted = (listMode === "spots" ? getFilteredSpots() : getFilteredCities()).slice().sort(function(a, b) {
      var byDate = forecastSortValue(a.bloom) - forecastSortValue(b.bloom);
      if (byDate !== 0) return byDate;
      return a.order - b.order;
    });

    if (!sorted.length) {
      container.innerHTML = '<div class="no-results"><i class="fa-regular fa-face-sad-tear"></i>' + escapeHtml(tr(listMode === "spots" ? "noSpots" : "noCities")) + '</div>';
      return;
    }

    container.innerHTML = sorted.map(function(item, index) {
      return listMode === "spots" ? buildSpotCard(item, index) : buildCityCard(item, index);
    }).join("");

    container.querySelectorAll(".city-card").forEach(function(card) {
      card.addEventListener("click", function() {
        if (card.dataset.spot) {
          selectSpot(card.dataset.spot);
          return;
        }
        selectCity(card.dataset.city);
      });
    });
  }

  function updateStatBar() {
    if (sourceState.mode === "loading" && !cities.length) {
      document.getElementById("statBar").innerHTML = escapeHtml(tr("loadingCities"));
      return;
    }
    if (listMode === "spots" && spotDataState.mode === "loading" && !spots.length) {
      document.getElementById("statBar").innerHTML = escapeHtml(tr("statLoading"));
      return;
    }
    var filtered = listMode === "spots" ? getFilteredSpots() : getFilteredCities();
    var bloomingCount = filtered.filter(function(item) {
      var status = getStatus(item);
      return status === "blooming" || status === "full_bloom";
    }).length;
    var sourceCopy = sourceState.mode === "live" ? tr("statSourceLive") : tr("statSourceFallback");
    var unit = listMode === "spots" ? tr("spotsUnit") : tr("citiesUnit");
    document.getElementById("statBar").innerHTML = tmpl(tr("statBar"), { count: bloomingCount, total: filtered.length, unit: unit, source: sourceCopy });
  }

  function selectCity(name) {
    selectedCity = name;
    selectedSpot = null;
    var city = cities.find(function(item) { return item.name === name; });
    if (!city) return;
    if (isMobileViewport() && sidebarOpen) {
      setSidebarOpen(false);
    }
    refreshMarkers();
    renderCityList();
    focusMarkerPopup(cityMarkerMap[name], city.lat, city.lng, 9);

    var card = document.querySelector('.city-card[data-city="' + name + '"]');
    if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function selectSpot(id) {
    var spot = spots.find(function(item) { return item.id === id; });
    if (!spot) return;
    if (isMobileViewport() && sidebarOpen) {
      setSidebarOpen(false);
    }
    listMode = "spots";
    selectedSpot = id;
    selectedCity = spot.cityName;
    if (sourceState.mode !== "loading") ensureSpotDataLoaded();
    invalidateDerivedState();
    scheduleRender({ translations: true, spotFilters: true, markers: true, cityList: true, statBar: true, mapInfo: true });
    if (spotMarkerMap[id] && hasValidCoordinates(spot)) {
      focusMarkerPopup(spotMarkerMap[id], spot.lat, spot.lng, 11);
    } else if (cityMarkerMap[spot.cityName]) {
      var city = cities.find(function(item) { return item.name === spot.cityName; });
      if (city) focusMarkerPopup(cityMarkerMap[spot.cityName], city.lat, city.lng, 10);
    }

    var card = document.querySelector('.city-card[data-spot="' + id + '"]');
    if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  /* ── Mobile ── */
  function setSidebarOpen(open) {
    sidebarOpen = open;
    var sidebar = document.getElementById("sidebar");
    var button = document.getElementById("mobileToggle");
    if (sidebar) sidebar.classList.toggle("open", open);
    if (button) {
      button.innerHTML = open
        ? '<i class="fa-solid fa-map"></i> ' + escapeHtml(tr("mobileMap"))
        : '<i class="fa-solid fa-list"></i> ' + escapeHtml(tr("mobileList"));
    }
    if (map && isMobileViewport()) {
      window.setTimeout(function() {
        map.invalidateSize(false);
      }, open ? 220 : 360);
    }
  }

  function toggleSidebar() {
    setSidebarOpen(!sidebarOpen);
  }

  /* ── Petals ── */
  function createPetals() {
    var container = document.getElementById("petalsContainer");
    if (!container || container.childNodes.length || prefersReducedMotion() || isMobileViewport()) return;
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < 15; i++) {
      var petal = document.createElement("div");
      petal.className = "petal";
      var size = 8 + Math.random() * 10;
      var left = Math.random() * 100;
      var duration = 9 + Math.random() * 13;
      var delay = Math.random() * 16;
      var drift = -60 + Math.random() * 120;
      var spin = 360 + Math.random() * 720;
      petal.style.cssText = "left:" + left + "%;width:" + size + "px;height:" + size + "px;animation-duration:" + duration + "s;animation-delay:" + delay + "s;--drift:" + drift + "px;--spin:" + spin + "deg;animation-iteration-count:infinite;";
      petal.innerHTML = '<div class="petal-shape"></div>';
      fragment.appendChild(petal);
    }
    container.appendChild(fragment);
  }

  function warmVisualEffects() {
    scheduleIdleTask(function() {
      createPetals();
    }, 1200);
  }

  function renderAll() {
    cancelScheduledRender();
    updateStaticTranslations();
    updateDateDisplay();
    updateSourceDisplay();
    updateLoadingStatus();
    populateMarkers();
    renderRegionFilters();
    renderSpotFilters();
    renderCityList();
    updateStatBar();
    updateMapInfo();
  }

  /* ── Events ── */
  function bindEvents() {
    document.getElementById("searchInput").addEventListener("input", function(event) {
      var nextValue = event.target.value;
      window.clearTimeout(searchDebounceTimer);
      searchDebounceTimer = window.setTimeout(function() {
        searchTerm = nextValue;
        invalidateDerivedState();
        scheduleRender({ cityList: true, statBar: true, markers: true, mapInfo: true, fit: true });
      }, 90);
    });

    document.querySelectorAll(".view-btn").forEach(function(button) {
      button.addEventListener("click", function() {
        if (listMode === button.dataset.view) return;
        listMode = button.dataset.view;
        if (listMode === "cities") {
          selectedSpot = null;
          cancelSpotDataLoad();
        }
        if (listMode === "spots" && sourceState.mode !== "loading") ensureSpotDataLoaded();
        invalidateDerivedState();
        scheduleRender({ translations: true, spotFilters: true, cityList: true, statBar: true, markers: true, mapInfo: true, fit: true });
      });
    });

    document.querySelectorAll(".lang-btn").forEach(function(button) {
      button.addEventListener("click", function() {
        if (currentLang === button.dataset.lang) return;
        currentLang = button.dataset.lang;
        invalidateDerivedState();
        renderAll();
        if (selectedSpot && spotMarkerMap[selectedSpot]) {
          spotMarkerMap[selectedSpot].openPopup();
          return;
        }
        if (selectedCity && cityMarkerMap[selectedCity]) cityMarkerMap[selectedCity].openPopup();
      });
    });

    document.getElementById("legendToggle").addEventListener("click", function() {
      document.getElementById("legendPanel").classList.toggle("visible");
    });

    document.getElementById("mobileToggle").addEventListener("click", toggleSidebar);

    window.addEventListener("resize", function() {
      if (map) {
        map.invalidateSize(false);
      }
    });

    document.getElementById("dateSlider").addEventListener("input", function(event) {
      currentDate = sliderOffsetToDate(parseInt(event.target.value, 10));
      invalidateDerivedState();
      scheduleRender({ dateDisplay: true, markers: true, cityList: true, statBar: true, mapInfo: true });
    });

    document.getElementById("map").addEventListener("click", function(event) {
      if (event.target === document.getElementById("map") || event.target.classList.contains("leaflet-container")) {
        document.getElementById("legendPanel").classList.remove("visible");
      }
    });
  }

  /* ── Init ── */
  async function init() {
    sourceState = { mode: "loading", updatedText: "", liveCount: 0, message: "Loading live forecast from WeatherMap." };
    setCities([]);
    updateStaticTranslations();
    initMap();
    renderAll();
    warmVisualEffects();
    bindEvents();

    updateSourceDisplay();
    updateMapInfo();

    sourceState = await loadLiveData();
    renderAll();
    fitVisibleCities();
    if (listMode === "spots") ensureSpotDataLoaded();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
