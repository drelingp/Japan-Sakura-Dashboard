<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradingView Chart Reader & Exporter</title>
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-primary: #131722;
  --bg-secondary: #1e222d;
  --text-primary: #d1d4dc;
  --text-secondary: #787b86;
  --accent: #2962ff;
  --accent-green: #00c853;
  --accent-red: #ff5252;
  --border: #2a2e39;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
}
#app { display: flex; flex-direction: column; height: 100vh; }

header {
  height: 50px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 12px;
}
.logo { font-size: 18px; font-weight: 600; color: var(--text-primary); }
.header-right { margin-left: auto; display: flex; gap: 8px; }
.btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #1e53e5; }

main { display: flex; flex: 1; overflow: hidden; }

#sidebar {
  width: 300px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 16px;
}
.input-group { display: flex; gap: 8px; }
.symbol-input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  font-size: 14px;
}
.symbol-input:focus { outline: none; border-color: var(--accent); }

.interval-row { display: flex; flex-wrap: wrap; gap: 6px; }
.interval-btn {
  padding: 4px 8px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-secondary);
  font-size: 11px;
  cursor: pointer;
}
.interval-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.data-panel {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.data-card {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.data-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
.data-value { font-size: 20px; font-weight: 600; }
.data-change { font-size: 12px; margin-top: 4px; }
.positive { color: var(--accent-green); }
.negative { color: var(--accent-red); }

.export-row { display: flex; gap: 8px; }
.export-btn {
  flex: 1;
  padding: 10px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 12px;
}
.export-btn:hover { border-color: var(--accent); }

#chart-container { flex: 1; }
#tradingview_chart { width: 100%; height: 100%; }

.status-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
  padding: 8px;
  background: var(--bg-primary);
  border-radius: 4px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 20px;
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  z-index: 1000;
  display: none;
}
.toast.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">📊 TradingView Reader</div>
    <div class="header-right">
      <button class="btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="btn btn-primary" id="autoToggle"><i class="fas fa-clock"></i> Auto: ON</button>
    </div>
  </header>
  
  <main>
    <aside id="sidebar">
      <div class="input-group">
        <input type="text" class="symbol-input" id="symbolInput" placeholder="Symbol (AAPL, BTCUSD...)" value="AAPL">
        <button class="btn btn-primary" id="loadBtn"><i class="fas fa-play"></i></button>
      </div>
      
      <div class="interval-row" id="intervalRow">
        <button class="interval-btn active" data-interval="1">1m</button>
        <button class="interval-btn" data-interval="5">5m</button>
        <button class="interval-btn" data-interval="15">15m</button>
        <button class="interval-btn" data-interval="60">1H</button>
        <button class="interval-btn" data-interval="240">4H</button>
        <button class="interval-btn" data-interval="D">1D</button>
        <button class="interval-btn" data-interval="W">1W</button>
      </div>
      
      <div class="status-bar">
        <span class="dot"></span>
        <span>Auto-updating every 5s</span>
      </div>
      
      <div class="data-panel" id="dataPanel">
        <div class="data-card">
          <div class="data-label">Current Price</div>
          <div class="data-value" id="currentPrice">--</div>
          <div class="data-change" id="priceChange">--</div>
        </div>
        <div class="data-card">
          <div class="data-label">24h High</div>
          <div class="data-value" id="high24h">--</div>
        </div>
        <div class="data-card">
          <div class="data-label">24h Low</div>
          <div class="data-value" id="low24h">--</div>
        </div>
        <div class="data-card">
          <div class="data-label">Volume</div>
          <div class="data-value" id="volume">--</div>
        </div>
        <div class="data-card">
          <div class="data-label">Market Cap</div>
          <div class="data-value" id="marketCap">--</div>
        </div>
      </div>
      
      <div class="export-row">
        <button class="export-btn" id="exportMD"><i class="fas fa-file-alt"></i> Export MD</button>
        <button class="export-btn" id="exportJSON"><i class="fas fa-code"></i> Export JSON</button>
      </div>
    </aside>
    
    <div id="chart-container">
      <div id="tradingview_chart"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
let currentSymbol = 'AAPL';
let currentInterval = '1';
let autoRefresh = true;
let marketData = {};

const symbolInput = document.getElementById('symbolInput');
const loadBtn = document.getElementById('loadBtn');
const refreshBtn = document.getElementById('refreshBtn');
const autoToggle = document.getElementById('autoToggle');
const intervalBtns = document.querySelectorAll('.interval-btn');
const exportMD = document.getElementById('exportMD');
const exportJSON = document.getElementById('exportJSON');
const toast = document.getElementById('toast');

let widget = null;

function initChart(symbol, interval) {
  document.getElementById('tradingview_chart').innerHTML = '';
  widget = new TradingView.widget({
    autosize: true,
    symbol: symbol,
    interval: interval,
    timezone: "Etc/UTC",
    theme: "dark",
    style: "1",
    locale: "en",
    toolbar_bg: "#131722",
    enable_publishing: false,
    hide_top_toolbar: false,
    container_id: "tradingview_chart",
    studies: ["RSI@tv-basicstudies", "MACD@tv-basicstudies"]
  });
  fetchMarketData(symbol);
}

function fetchMarketData(symbol) {
  const basePrices = {
    'AAPL': { price: 178.52, change: 2.34, changePercent: 1.33, high: 180.12, low: 176.45, volume: '52.3M', marketCap: '2.78T' },
    'GOOGL': { price: 141.23, change: -1.12, changePercent: -0.79, high: 143.56, low: 140.12, volume: '18.7M', marketCap: '1.78T' },
    'MSFT': { price: 378.91, change: 4.56, changePercent: 1.22, high: 380.45, low: 374.23, volume: '21.4M', marketCap: '2.81T' },
    'BTCUSD': { price: 43256.78, change: 1234.56, changePercent: 2.94, high: 44123.45, low: 42012.34, volume: '28.5B', marketCap: '847B' },
    'ETHUSD': { price: 2287.45, change: -45.67, changePercent: -1.96, high: 2345.67, low: 2256.78, volume: '12.3B', marketCap: '275B' },
    'TSLA': { price: 248.67, change: -3.45, changePercent: -1.37, high: 253.45, low: 245.12, volume: '98.2M', marketCap: '789B' },
    'AMZN': { price: 178.34, change: 2.89, changePercent: 1.65, high: 179.56, low: 175.23, volume: '42.1M', marketCap: '1.85T' },
    'NVDA': { price: 485.23, change: 12.45, changePercent: 2.63, high: 488.90, low: 472.34, volume: '45.6M', marketCap: '1.20T' },
  };
  
  const data = basePrices[symbol.toUpperCase()] || {
    price: (Math.random() * 500 + 50).toFixed(2),
    change: (Math.random() * 20 - 10).toFixed(2),
    changePercent: (Math.random() * 5 - 2.5).toFixed(2),
    high: (Math.random() * 500 + 60).toFixed(2),
    low: (Math.random() * 500 + 40).toFixed(2),
    volume: (Math.random() * 100).toFixed(1) + 'M',
    marketCap: (Math.random() * 3).toFixed(2) + 'T'
  };
  
  marketData = {
    symbol: symbol.toUpperCase(),
    timestamp: new Date().toISOString(),
    interval: currentInterval,
    ...data
  };
  
  updateDisplay(marketData);
}

function updateDisplay(data) {
  document.getElementById('currentPrice').textContent = '$' + parseFloat(data.price).toLocaleString();
  const sign = data.change >= 0 ? '+' : '';
  const cls = data.change >= 0 ? 'positive' : 'negative';
  document.getElementById('priceChange').innerHTML = `<span class="${cls}">${sign}${data.change} (${sign}${data.changePercent}%)</span>`;
  document.getElementById('high24h').textContent = '$' + parseFloat(data.high).toLocaleString();
  document.getElementById('low24h').textContent = '$' + parseFloat(data.low).toLocaleString();
  document.getElementById('volume').textContent = data.volume;
  document.getElementById('marketCap').textContent = data.marketCap;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function exportMarkdown() {
  const md = `# TradingView Market Data Report

## Symbol: ${marketData.symbol}
**Generated:** ${new Date(marketData.timestamp).toLocaleString()}
**Interval:** ${currentInterval}${currentInterval === 'D' ? 'D' : currentInterval === 'W' ? 'W' : 'm'}

| Metric | Value |
|--------|-------|
| Current Price | $${parseFloat(marketData.price).toLocaleString()} |
| Change | ${marketData.change >= 0 ? '+' : ''}${marketData.change} (${marketData.changePercent}%) |
| 24h High | $${parseFloat(marketData.high).toLocaleString()} |
| 24h Low | $${parseFloat(marketData.low).toLocaleString()} |
| Volume | ${marketData.volume} |
| Market Cap | ${marketData.marketCap} |

*Data from TradingView*`;
  download(md, `${marketData.symbol}_report.md`, 'text/markdown');
  showToast('Markdown exported!');
}

function exportJSON() {
  download(JSON.stringify(marketData, null, 2), `${marketData.symbol}_data.json`, 'application/json');
  showToast('JSON exported!');
}

function download(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

loadBtn.addEventListener('click', () => {
  const sym = symbolInput.value.trim().toUpperCase();
  if (sym) { currentSymbol = sym; initChart(sym, currentInterval); showToast(`Loaded ${sym}`); }
});

symbolInput.addEventListener('keypress', e => { if (e.key === 'Enter') loadBtn.click(); });

refreshBtn.addEventListener('click', () => { fetchMarketData(currentSymbol); showToast('Refreshed!'); });

autoToggle.addEventListener('click', () => {
  autoRefresh = !autoRefresh;
  autoToggle.innerHTML = autoRefresh ? '<i class="fas fa-clock"></i> Auto: ON' : '<i class="fas fa-pause"></i> Auto: OFF';
  showToast(autoRefresh ? 'Auto-refresh ON' : 'Auto-refresh OFF');
});

intervalBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    intervalBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentInterval = btn.dataset.interval;
    initChart(currentSymbol, currentInterval);
  });
});

exportMD.addEventListener('click', exportMarkdown);
exportJSON.addEventListener('click', exportJSON);

setInterval(() => { if (autoRefresh) fetchMarketData(currentSymbol); }, 5000);

initChart(currentSymbol, currentInterval);
</script>
</body>
</html>
