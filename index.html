<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japan Sakura Forecast 2026 🌸</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" >
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" >
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #FFF7F9;
  --bg-secondary: #FFFFFF;
  --bg-tertiary: #FFF0F4;
  --bg-glass: rgba(255, 255, 255, 0.88);
  --text-primary: #2D1B30;
  --text-secondary: #6B4C6E;
  --text-tertiary: #9E7DA1;
  --accent: #D6336C;
  --accent-soft: #F06595;
  --accent-light: #FFCCD5;
  --accent-bg: #FFF0F3;
  --bloom-pending: #90A4AE;
  --bloom-not-yet: #66BB6A;
  --bloom-budding: #FFA726;
  --bloom-blooming: #F48FB1;
  --bloom-full: #E91E63;
  --bloom-falling: #CE93D8;
  --bloom-ended: #BDBDBD;
  --border: #F5D5DE;
  --shadow: 0 2px 16px rgba(45, 27, 48, 0.07);
  --shadow-lg: 0 8px 32px rgba(45, 27, 48, 0.12);
  --radius: 14px;
  --radius-sm: 8px;
  --sidebar-width: 380px;
  --header-height: 56px;
  --slider-height: 58px;
}
.dark {
  --bg-primary: #18101D;
  --bg-secondary: #221729;
  --bg-tertiary: #2C1D34;
  --bg-glass: rgba(34, 23, 41, 0.92);
  --text-primary: #F5E6F0;
  --text-secondary: #C9A8CE;
  --text-tertiary: #8E6F92;
  --accent: #F48FB1;
  --accent-soft: #F06595;
  --accent-light: #5C2240;
  --accent-bg: #2E1525;
  --border: #3D2842;
  --shadow: 0 2px 16px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100vh; position: relative; overflow: hidden; }

/* ── Header ── */
header {
  height: var(--header-height);
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
  flex-shrink: 0;
  gap: 14px;
}
.logo { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.logo-icon { font-size: 22px; }
.logo h1 {
  font-family: 'Cormorant', serif;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.3px;
  color: var(--text-primary);
}
.logo h1 span { color: var(--accent); font-weight: 400; }
.header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.lang-switch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--bg-primary);
}
.lang-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 11px;
  padding: 5px 9px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
}
.lang-btn:hover { color: var(--accent); }
.lang-btn.active {
  background: var(--accent);
  color: #fff;
}
.legend-btn {
  background: var(--accent-bg);
  border: 1px solid var(--border);
  color: var(--accent);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-family: 'Zen Maru Gothic', sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.legend-btn:hover { background: var(--accent); color: #fff; }

/* ── Date Slider Strip ── */
.date-slider-strip {
  height: var(--slider-height);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 999;
}
.date-display {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 170px;
  flex-shrink: 0;
}
.date-display .date-main {
  font-family: 'Cormorant', serif;
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
}
.date-display .date-year {
  font-size: 13px;
  color: var(--text-tertiary);
}
.slider-wrap { flex: 1; min-width: 0; }
.date-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 7px;
  border-radius: 4px;
  background: linear-gradient(to right, #81C784, #A5D6A7, #FFE082, #F48FB1, #EC407A, #CE93D8, #BDBDBD);
  outline: none;
  cursor: pointer;
  margin-bottom: 2px;
}
.date-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 2px 10px rgba(214, 51, 108, 0.35);
  cursor: grab;
  transition: transform 0.15s;
}
.date-range::-webkit-slider-thumb:active { transform: scale(1.15); cursor: grabbing; }
.date-range::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #fff;
  box-shadow: 0 2px 10px rgba(214, 51, 108, 0.35);
  cursor: grab;
}
.slider-ticks {
  display: flex;
  justify-content: space-between;
  padding: 0 2px;
}
.slider-ticks span {
  font-size: 10px;
  color: var(--text-tertiary);
  letter-spacing: 0.3px;
}
.source-copy {
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-secondary);
  text-align: right;
}
.source-copy strong { color: var(--accent); }

.loading-status {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 8px 20px 10px;
  display: none;
  gap: 6px;
}
.loading-status.visible { display: grid; }
.loading-status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 11.5px;
  color: var(--text-secondary);
}
.loading-status-label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.loading-status-value {
  color: var(--text-tertiary);
  white-space: nowrap;
}
.loading-bar {
  position: relative;
  height: 5px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--border);
}
.loading-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, #F48FB1, #D6336C, #FFA726);
  transition: width 0.22s ease;
}
.loading-bar.indeterminate .loading-bar-fill {
  width: 38%;
  animation: loadingBarIndeterminate 1.1s ease-in-out infinite;
}
@keyframes loadingBarIndeterminate {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(320%); }
}

/* ── Main layout ── */
main { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  z-index: 500;
}
.sidebar-header { padding: 14px 16px 10px; flex-shrink: 0; }
.search-box { position: relative; margin-bottom: 10px; }
.search-box i {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  font-size: 13px;
}
.search-box input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-primary);
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text-tertiary); }
.region-filters { display: flex; flex-wrap: wrap; gap: 5px; }
.region-pill {
  padding: 5px 11px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-secondary);
  font-size: 11.5px;
  font-family: 'Zen Maru Gothic', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.region-pill:hover { border-color: var(--accent-soft); color: var(--accent); }
.region-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.stat-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  font-size: 12px;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-bar strong { color: var(--accent); font-weight: 700; }

/* ── City List ── */
.city-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  scroll-behavior: smooth;
}
.city-list::-webkit-scrollbar { width: 5px; }
.city-list::-webkit-scrollbar-track { background: transparent; }
.city-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.city-card {
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  margin-bottom: 4px;
}
.city-card:hover { background: var(--bg-tertiary); }
.city-card.selected {
  background: var(--accent-bg);
  border-color: var(--accent-light);
}
.city-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 3px;
}
.city-name-wrap {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}
.card-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.5);
  box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
}
.dark .card-dot { border-color: rgba(0,0,0,0.3); }
.city-name { font-weight: 700; font-size: 14px; }
.city-name-ja { font-size: 11px; color: var(--text-tertiary); }
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 10.5px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
}
.city-card-mid {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  color: var(--text-secondary);
  margin-bottom: 3px;
}
.city-card-mid .temp { color: var(--text-tertiary); }
.city-countdown {
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
}
.city-spot {
  font-size: 11px;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.city-spots-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.spot-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 10.5px;
  line-height: 1;
}

.list-view-switch {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.spot-filters {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}
.spot-filters.hidden {
  display: none;
}
.spot-filter-group {
  display: grid;
  gap: 6px;
}
.spot-filter-label {
  font-size: 10.5px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.spot-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.spot-filter-pill {
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 10.5px;
  font-family: 'Zen Maru Gothic', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.spot-filter-pill.active {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: var(--accent-light);
}
.view-btn {
  border: 1px solid var(--border);
  background: var(--bg-primary);
  color: var(--text-secondary);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-family: 'Zen Maru Gothic', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.view-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.spot-card-parent {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 3px;
}
.spot-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.spot-card-meta .spot-chip {
  margin-top: 0;
}

/* ── Status Colors ── */
.status-pending { background: #ECEFF1; color: #546E7A; }
.status-not_yet { background: #E8F5E9; color: #2E7D32; }
.status-budding { background: #FFF3E0; color: #E65100; }
.status-blooming { background: #FCE4EC; color: #C2185B; }
.status-full_bloom { background: #F8BBD0; color: #AD1457; }
.status-falling { background: #F3E5F5; color: #7B1FA2; }
.status-ended { background: #F5F5F5; color: #757575; }
.dark .status-pending { background: #263238; color: #B0BEC5; }
.dark .status-not_yet { background: #1B3A1E; color: #81C784; }
.dark .status-budding { background: #3E2400; color: #FFB74D; }
.dark .status-blooming { background: #3D1228; color: #F48FB1; }
.dark .status-full_bloom { background: #4A0E2E; color: #F06292; }
.dark .status-falling { background: #2A1040; color: #CE93D8; }
.dark .status-ended { background: #2A2A2A; color: #BDBDBD; }

/* ── Map ── */
#map-container { flex: 1; position: relative; }
#map { width: 100%; height: 100%; z-index: 1; }
.dark .leaflet-tile { filter: none; }
.dark .leaflet-control-zoom a { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--border); }
.leaflet-tile.tile-failed { opacity: 0 !important; }

/* ── Pin Markers ── */
.map-pin-wrap { position: relative; }
.map-pin {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2.5px solid #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  position: relative;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.map-pin::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 10px solid;
}
.map-pin:hover { transform: scale(1.25); }
.map-pin.spot-pin {
  width: 16px;
  height: 16px;
  border-width: 2px;
}
.map-pin.spot-pin::after {
  bottom: -6px;
  border-left-width: 4px;
  border-right-width: 4px;
  border-top-width: 7px;
}
.map-pin.pulse { animation: pinPulse 2s ease-out infinite; }
@keyframes pinPulse {
  0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 0 0 rgba(233, 30, 99, 0.35); }
  50% { box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 0 10px rgba(233, 30, 99, 0); }
}
.map-pin-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
}
.dark .map-pin { border-color: var(--bg-secondary); }
.pin-label {
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-glass);
  color: var(--text-primary);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  box-shadow: var(--shadow);
}
.map-pin-wrap:hover .pin-label, .map-pin-wrap.active .pin-label { opacity: 1; }

/* ── Leaflet Popup (Rich) ── */
.leaflet-popup-content-wrapper {
  border-radius: var(--radius) !important;
  box-shadow: var(--shadow-lg) !important;
  background: var(--bg-secondary) !important;
  padding: 0 !important;
  overflow: hidden;
}
.leaflet-popup-content { margin: 0 !important; width: auto !important; }
.leaflet-popup-tip { background: var(--bg-secondary) !important; }
.popup-inner {
  min-width: 250px;
  max-width: 310px;
  display: flex;
  flex-direction: column;
  max-height: min(520px, calc(100vh - 110px));
}
.popup-top-band {
  padding: 14px 18px 10px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.popup-header { display: flex; align-items: baseline; gap: 6px; margin-bottom: 1px; }
.popup-city {
  font-family: 'Cormorant', serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--text-primary);
}
.popup-ja { font-size: 13px; color: var(--text-tertiary); }
.popup-region-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 4px;
}
.popup-region { font-size: 12px; color: var(--text-tertiary); }
.popup-status .status-badge { font-size: 12px; padding: 4px 11px; }
.popup-body {
  padding: 14px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
}
.popup-progress-section { margin-bottom: 12px; }
.popup-progress-label {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 5px;
  display: flex;
  justify-content: space-between;
}
.popup-progress-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  overflow: hidden;
}
.popup-progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #66BB6A, #FFA726, #F48FB1, #E91E63);
  transition: width 0.5s ease;
}
.popup-info {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  font-size: 12.5px;
  margin-bottom: 10px;
}
.popup-info dt { color: var(--text-tertiary); white-space: nowrap; }
.popup-info dd { color: var(--text-primary); font-weight: 500; }
.popup-tip {
  background: var(--accent-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 11.5px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 10px;
}
.popup-tip strong { color: var(--accent); }
.popup-countdown {
  text-align: center;
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.popup-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
.popup-links a {
  text-decoration: none;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  line-height: 1;
}
.popup-links a:hover {
  background: var(--accent);
  color: #fff;
}
.popup-spots {
  margin-bottom: 10px;
}
.popup-subtitle {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.popup-spot-list {
  display: grid;
  gap: 8px;
}
.popup-spot-item {
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
}
.popup-spot-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.popup-spot-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-primary);
}
.popup-spot-sub {
  font-size: 10.5px;
  color: var(--text-tertiary);
}
.popup-spot-forecast {
  font-size: 11px;
  color: var(--text-secondary);
}

/* ── Sakura Tooltip ── */
.sakura-tooltip {
  background: var(--bg-glass) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border) !important;
  color: var(--text-primary) !important;
  font-family: 'Zen Maru Gothic', sans-serif !important;
  font-size: 12px !important;
  font-weight: 500 !important;
  padding: 5px 10px !important;
  border-radius: 8px !important;
  box-shadow: var(--shadow) !important;
}
.sakura-tooltip::before { border-top-color: var(--border) !important; }

/* ── Legend Panel ── */
.legend-panel {
  position: absolute;
  top: 12px;
  right: 12px;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-lg);
  z-index: 800;
  font-size: 12px;
  border: 1px solid var(--border);
  display: none;
}
.legend-panel.visible { display: block; }
.legend-panel h3 {
  font-family: 'Cormorant', serif;
  font-weight: 700;
  font-size: 15px;
  margin-bottom: 8px;
  color: var(--text-primary);
}
.legend-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

/* ── Map Info ── */
.map-info {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 11.5px;
  color: var(--text-secondary);
  z-index: 600;
  border: 1px solid var(--border);
  white-space: nowrap;
  pointer-events: none;
}

/* ── Falling Petals ── */
.petal {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0;
  will-change: transform, opacity;
  animation: petalFall linear forwards;
}
.petal-shape {
  width: 100%;
  height: 100%;
  background: var(--accent-light);
  border-radius: 50% 0 50% 0;
  opacity: 0.55;
}
.dark .petal-shape { opacity: 0.25; }
@keyframes petalFall {
  0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  5% { opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateY(105vh) translateX(var(--drift)) rotate(var(--spin)); opacity: 0; }
}

/* ── Mobile Toggle ── */
.mobile-toggle {
  display: none;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 24px;
  border-radius: 24px;
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  z-index: 1100;
  box-shadow: 0 4px 20px rgba(214, 51, 108, 0.35);
  transition: transform 0.2s;
}
.mobile-toggle:active { transform: translateX(-50%) scale(0.95); }

/* ── No results ── */
.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
  font-size: 14px;
}
.no-results i { font-size: 32px; display: block; margin-bottom: 12px; opacity: 0.4; }

/* ── Responsive ── */
@media (max-width: 768px) {

  .date-slider-strip {

  }
  .date-display {
    min-width: auto;
    flex: 1 1 auto;
  }
  .date-display .date-main { font-size: 16px; }
  .slider-wrap {
    order: 3;

  }

    order: 2;

    flex: 0 1 46%;

    font-size: 11px;
  }

  .spot-filter-row {
    overflow-x: auto;
    flex-wrap: nowrap;
    padding-bottom: 2px;
  }
  main { flex-direction: column; }
  #sidebar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: min(62vh, 560px);
    max-height: calc(100vh - 120px);
    padding-bottom: env(safe-area-inset-bottom);
    border-right: none;
    border-top: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1050;
    box-shadow: 0 -4px 30px rgba(0,0,0,0.1);
  }
  #sidebar.open { transform: translateY(0); }
  .mobile-toggle { display: block; }
  #map-container { height: 100%; }
  .map-info {
    display: none;
    bottom: 70px;

    line-height: 1.35;
    padding: 6px 10px;

  .map-info.is-loading { display: block; }
  .legend-panel { top: 8px; right: 8px; font-size: 11px; padding: 10px 12px; }
  .popup-inner {

/* ── Entrance animations ── */
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(10px); }

        try {
          results[currentIndex] = { status: "fulfilled", value: await worker(items[currentIndex], currentIndex) };

    for (var i = 0; i < workerCount; i++) {
